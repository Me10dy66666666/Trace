<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastlane</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #e7edf5; background: #0b1018; }
    main { width: min(460px, calc(100vw - 48px)); padding: 28px; border: 1px solid #26384b; border-radius: 16px; background: #111a26; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); text-align: center; }
    .eyebrow { color: #67d9ff; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 20px; }
    p { margin: 0; color: #9aadc1; line-height: 1.6; }
    .error { color: #ff9a9a; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Pastlane</div>
    <h1>Opening Project Trace Graph</h1>
    <p id="message">Connecting to the Codex in-app browser…</p>
  </main>
  <script>
    const browserUrl = new URL("__TRACEANDBACK_BROWSER_URL__");
    const output = window.openai?.toolOutput;
    const payload = output?.structuredContent ?? output?.result?.structuredContent ?? output;
    const message = document.getElementById("message");

    async function openBrowser() {
      const repository = payload?.repository?.path;
      if (!repository || typeof window.openai?.openExternal !== "function") {
        message.textContent = "Unable to open the top-level browser page: Codex browser capabilities are unavailable.";
        message.classList.add("error");
        return;
      }
      browserUrl.searchParams.set("repository", repository);
      try {
        const result = await window.openai.openExternal({ href: browserUrl.href });
        if (result?.isError) throw new Error("openExternal failed");
        message.textContent = "The Trace Graph is open in the Codex in-app browser.";
      } catch {
        message.textContent = "Unable to open the top-level browser page. Check Codex browser permissions.";
        message.classList.add("error");
      }
    }

    void openBrowser();
  </script>
</body>
</html>
