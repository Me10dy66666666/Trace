<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceAndBack · Git History</title>
<style>
:root{color-scheme:dark;--bg:#090c12;--panel:#121823;--panel2:#192231;--line:#2b3748;--text:#eef3f8;--muted:#8e9caf;--cyan:#68d9ef;--violet:#a394ff;--green:#6fe7ae;--danger:#ff8e9d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{min-height:100vh;background:radial-gradient(circle at 75% 0,rgba(104,217,239,.08),transparent 32%),var(--bg)}header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(142,156,175,.16);background:rgba(9,12,18,.88)}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#071014;background:linear-gradient(135deg,var(--cyan),var(--violet));font-weight:900}.heading{min-width:0}.heading b,.heading span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.heading span{color:var(--muted);font-size:11px}.live{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--green);font-size:11px}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.refresh{padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--panel2);cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 18px}.stat{padding:12px;border:1px solid var(--line);border-radius:11px;background:rgba(18,24,35,.88)}.stat strong,.stat span{display:block}.stat strong{font-size:17px}.stat span{margin-top:2px;color:var(--muted);font-size:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:0 18px 18px}.timeline,.detail,.empty{border:1px solid var(--line);border-radius:13px;background:rgba(18,24,35,.92)}.timeline{position:relative;padding:17px}.timeline:before{content:"";position:absolute;top:30px;bottom:30px;left:37px;width:1px;background:linear-gradient(var(--violet),rgba(163,148,255,.08))}.card{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;margin-bottom:11px}.dot{position:relative;z-index:1;width:13px;height:13px;margin:15px 0 0 3px;border:3px solid var(--panel);border-radius:50%;background:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}.card-body{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:inherit;text-align:left;background:#171f2b;cursor:pointer}.card-body:hover,.card.selected .card-body{border-color:var(--cyan);background:#182b32}.row{display:flex;align-items:center;gap:9px}.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row time{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}.commit{display:flex;gap:7px;margin-top:7px;color:var(--muted);font-size:10px}.commit code{color:var(--cyan);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.changes{margin-top:8px;color:var(--muted);font-size:11px}.detail{position:sticky;top:12px;align-self:start;padding:16px}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.detail h2{margin:6px 0 2px;font-size:16px}.detail p{margin:9px 0;color:var(--muted)}dl{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;margin:15px 0;padding-top:13px;border-top:1px solid rgba(142,156,175,.16);font-size:11px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--panel2);cursor:pointer}.action.primary{grid-column:1/-1;color:#071014;border-color:transparent;background:var(--cyan);font-weight:800}.empty{margin:18px;padding:38px;text-align:center}.empty h1{margin:5px 0;font-size:18px}.empty p{margin:0;color:var(--muted)}.error{color:var(--danger)}.toast{position:fixed;right:18px;bottom:18px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#17202b;box-shadow:0 16px 40px rgba(0,0,0,.4);opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.detail{position:static}.summary{grid-template-columns:1fr}.row time{display:none}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const state={payload:null,selectedId:null,connected:false,pending:new Map(),nextId:1};
const esc=(value)=>String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const short=(value)=>value&&value!=="—"?String(value).slice(0,8):"—";
const graph=()=>state.payload?.graph??null;
const selected=()=>graph()?.nodes.find((node)=>node.id===state.selectedId)??graph()?.nodes[0]??null;
function notify(message){const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove("show"),2200)}
function bridgeValue(result){return result?.structuredContent??result?.result?.structuredContent??result}
function applyHostGraph(result){const payload=bridgeValue(result);if(!payload?.graph||!Array.isArray(payload.graph.nodes))return false;state.payload=payload;state.selectedId=payload.graph.nodes[0]?.id??null;state.connected=true;render();return true}
function requestHost(method,params){if(window.parent===window)return Promise.reject(new Error("MCP Apps host bridge unavailable"));const id=state.nextId++;window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");return new Promise((resolve,reject)=>state.pending.set(id,{resolve,reject}))}
function callTool(name,args){const api=window.openai;if(api&&typeof api.callTool==="function")return api.callTool(name,args);return requestHost("tools/call",{name,arguments:args})}
function installBridge(){const api=window.openai;if(api?.toolOutput)applyHostGraph(api.toolOutput);if(window.parent!==window||api)state.connected=true;window.addEventListener("message",(event)=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&state.pending.has(message.id)){const pending=state.pending.get(message.id);state.pending.delete(message.id);message.error?pending.reject(message.error):pending.resolve(message.result);return}if(message.method==="ui/notifications/tool-result")applyHostGraph(message.params?.structuredContent??message.params)}, {passive:true})}
function card(node){const active=node.id===state.selectedId?" selected":"";return `<article class="card${active}" data-node="${esc(node.id)}"><span class="dot"></span><button class="card-body" data-select="${esc(node.id)}"><div class="row"><b>${esc(node.title)}</b><time>${esc(new Date(node.createdAt).toLocaleString())}</time></div><div class="commit"><span>当前 <code>${esc(short(node.commit))}</code></span><span>父提交 <code>${esc(short(node.parent))}</code></span></div><div class="changes">${esc(node.changes)}</div></button></article>`}
function detail(node){if(!node)return "";const files=Array.isArray(node.changedFiles)?node.changedFiles.map((file)=>file.path).join("、"):node.files;return `<aside class="detail"><div class="eyebrow">Selected Git version</div><h2>${esc(node.title)}</h2><p>${esc(node.conversationSummary||node.summary)}</p><dl><dt>Commit</dt><dd>${esc(node.commit)}</dd><dt>Parent</dt><dd>${esc(node.parent)}</dd><dt>变更</dt><dd>${esc(node.diffStats)}</dd><dt>文件</dt><dd>${esc(files||"无")}</dd><dt>AI 上下文</dt><dd>${esc(node.warnings||"无")}</dd></dl><div class="actions"><button class="action" data-action="details">查看详情</button><button class="action" data-action="compare">比较父版本</button><button class="action primary" data-action="resume">从此版本继续</button></div></aside>`}
function render(){const root=document.getElementById("app");const data=graph();if(!data){root.innerHTML=`<main class="empty"><div class="eyebrow">TraceAndBack MCP App</div><h1>${state.connected?"正在读取当前仓库 Git 历史…":"请通过 TraceAndBack 打开此组件"}</h1><p>${state.connected?"工具结果到达后会自动渲染真实版本卡。":"独立打开不会显示任何演示或伪造数据。"}</p></main>`;return}const nodes=data.nodes??[];root.innerHTML=`<div class="shell"><header><div class="mark">↗</div><div class="heading"><b>${esc(data.name)} · Git History</b><span>${esc(data.branch)} · ${esc(data.status)}</span></div><div class="live">MCP 实时数据</div><button class="refresh" data-action="refresh">刷新</button></header><section class="summary"><div class="stat"><strong>${nodes.length}</strong><span>当前显示版本</span></div><div class="stat"><strong>${esc(data.branch)}</strong><span>当前分支</span></div><div class="stat"><strong>${esc(data.status)}</strong><span>工作树状态</span></div></section>${nodes.length===0?`<main class="empty"><div class="eyebrow">Repository connected</div><h1>当前分支还没有 Git 提交</h1><p>创建提交后点击刷新，版本卡会自动出现。</p></main>`:`<main class="layout"><section class="timeline">${nodes.map(card).join("")}</section>${detail(selected())}</main>`}</div>`;bind()}
function bind(){document.querySelectorAll("[data-select]").forEach((button)=>button.addEventListener("click",()=>{state.selectedId=button.dataset.select;render()}));document.querySelectorAll("[data-action]").forEach((button)=>button.addEventListener("click",()=>void act(button.dataset.action)))}
async function act(action){const node=selected();try{if(action==="refresh"){const result=await callTool("trace.render_graph",{repositoryId:state.payload?.repository?.id,limit:50,cursor:null});applyHostGraph(result);notify("Git 历史已刷新");return}if(!node)return;if(action==="details"){await callTool("trace.get_node",{nodeId:node.id});notify("版本详情已同步到对话");return}if(action==="compare"){if(!node.parentNodeId){notify("该版本没有可比较的父版本");return}await callTool("trace.compare",{fromNode:node.parentNodeId,toNode:node.id});notify("版本比较已同步到对话");return}if(action==="resume"){const result=await callTool("trace.resume_from",{nodeId:node.id,strategy:"worktree",checkpointCurrent:true});const value=bridgeValue(result);notify(value?.newBranch?`已创建 ${value.newBranch}`:"已从该版本继续")}}catch(error){notify(`操作失败：${error?.message??"未知错误"}`)}}
installBridge();render();
</script>
</body>
</html>
