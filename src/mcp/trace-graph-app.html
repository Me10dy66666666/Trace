<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceAndBack · Project Trace Graph</title>
<style>
:root {
  color-scheme: dark;
  --bg: #151311;
  --panel: #1d1a17;
  --panel-raised: #25201c;
  --panel-soft: #2d2722;
  --line: #453a31;
  --line-soft: rgba(205, 184, 164, .14);
  --text: #f4eee7;
  --muted: #b7aaa0;
  --dim: #8a7b70;
  --cyan: #d48761;
  --cyan-soft: rgba(212, 135, 97, .11);
  --green: #9cc7a2;
  --green-soft: rgba(156, 199, 162, .09);
  --amber: #dcb16a;
  --danger: #dc918b;
  --node-width: 236px;
  --node-height: 88px;
  --shadow: 0 16px 36px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .005em; }
button { border: 0; font: inherit; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
::selection { color: var(--text); background: rgba(212, 135, 97, .22); }

.shell {
  min-height: 100vh;
  background:
    radial-gradient(circle at 78% -12%, rgba(212, 135, 97, .045), transparent 28%),
    radial-gradient(circle at 14% 112%, rgba(188, 163, 132, .025), transparent 34%),
    var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 62px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line-soft);
  background: rgba(21, 19, 17, .88);
  backdrop-filter: blur(16px);
}
.brand-mark {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid rgba(212, 135, 97, .4);
  color: var(--cyan);
  background: rgba(212, 135, 97, .1);
  font-weight: 900;
  box-shadow: none;
}
.heading { min-width: 0; }
.heading strong, .heading span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heading strong { font-size: 13px; }
.heading span { margin-top: 1px; color: var(--muted); font-size: 11px; }
.topbar-spacer { flex: 1; }
.connection {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--green);
  font-size: 11px;
  white-space: nowrap;
}
.connection::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 7px rgba(156, 199, 162, .45);
  content: "";
}
.toolbar-button {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  background: rgba(45, 39, 34, .7);
  cursor: pointer;
}
.toolbar-button:hover { border-color: rgba(212, 135, 97, .5); background: var(--panel-soft); }

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 354px;
  gap: 14px;
  padding: 0 18px 18px;
}
.detail-panel, .empty {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(29, 26, 23, .96);
  box-shadow: var(--shadow);
}
.canvas-zoom-tools {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 4;
  display: flex;
  align-items: center;
  padding: 6px 7px;
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  background: rgba(29, 26, 23, .88);
  box-shadow: 0 10px 24px rgba(0, 0, 0, .2);
  backdrop-filter: blur(12px);
}
.graph-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.canvas-zoom-tools .graph-tools { margin-left: 0; }
.graph-tool {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}
.graph-tool:hover { color: var(--text); background: var(--panel-soft); }
.zoom-label { min-width: 42px; color: var(--muted); text-align: center; font-size: 10px; }
.canvas-viewport {
  position: relative;
  min-height: 0;
  max-height: calc(100vh - 205px);
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  background-color: #171411;
  background-image:
    linear-gradient(rgba(205, 184, 164, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(205, 184, 164, .035) 1px, transparent 1px),
    radial-gradient(circle at 50% 25%, rgba(212, 135, 97, .028), transparent 34%);
  background-size: 32px 32px, 32px 32px, auto;
}
.canvas-viewport.is-dragging { cursor: grabbing; user-select: none; }
.canvas-viewport::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(23, 20, 17, 0) 72%, rgba(23, 20, 17, .42));
  content: "";
}
.canvas-world { position: absolute; left: 0; top: 0; overflow: visible; transform-origin: top left; will-change: transform; }
.graph-edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.edge.git { stroke: rgba(212, 135, 97, .78); stroke-width: 2.15; marker-start: url(#edge-origin); marker-end: url(#arrow-git); }
.graph-edges #edge-origin circle { fill: #8f7964; }
.graph-edges #arrow-git path { fill: var(--cyan); }
.node-card {
  position: absolute;
  display: flex;
  flex-direction: column;
  width: var(--node-width);
  height: var(--node-height);
  min-height: var(--node-height);
  padding: 6px 8px;
  border: 1px solid #56463a;
  border-radius: 12px;
  background: linear-gradient(150deg, #29231e, #1f1a17 72%);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 244, 232, .025);
  cursor: pointer;
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.node-card::before {
  display: none;
  position: absolute;
  top: 10px;
  left: -5px;
  width: 8px;
  height: 8px;
  border: 2px solid #171411;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan), 0 0 9px rgba(212, 135, 97, .2);
  content: "";
}
.node-card:hover, .node-card.selected {
  border-color: var(--cyan);
  box-shadow: 0 16px 34px rgba(0, 0, 0, .34), 0 0 0 1px rgba(212, 135, 97, .12);
}
.node-card.selected { background: linear-gradient(150deg, #34251e, #241b17 72%); }
.node-card.published {
  border-color: rgba(156, 199, 162, .78);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .28), 0 0 0 1px rgba(156, 199, 162, .12);
}
.node-card.published:hover,
.node-card.published.selected {
  border-color: var(--cyan);
}
.node-card.selected.published {
  background: linear-gradient(150deg, #34251e, #241b17 72%);
  box-shadow: 0 16px 34px rgba(0, 0, 0, .34), 0 0 0 2px rgba(212, 135, 97, .22);
}
.published-badge {
  margin-left: auto;
  padding: 2px 5px;
  border: 1px solid rgba(156, 199, 162, .38);
  border-radius: 5px;
  color: var(--green);
  background: var(--green-soft);
  font-size: 8px;
  line-height: 1.1;
  white-space: nowrap;
}
.node-card.selected .published-badge {
  border-color: rgba(212, 135, 97, .48);
  color: var(--cyan);
  background: var(--cyan-soft);
}
.node-card-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.node-card-label { color: var(--cyan); font-size: 8px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
.node-icon { display: grid; flex: 0 0 auto; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: var(--cyan); background: var(--cyan-soft); font-size: 11px; }
.node-card .node-icon { width: 16px; height: 16px; border-radius: 5px; font-size: 9px; }
.node-time { margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.15; }
.node-time span { margin-right: 4px; color: var(--dim); }
.field-label { display: block; margin-bottom: 3px; color: var(--dim); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.node-card .field-label { margin-bottom: 2px; font-size: 8px; }
.node-update { display: block; flex: 1 1 auto; min-width: 0; min-height: 0; margin-top: 3px; overflow: auto; scrollbar-color: rgba(205, 184, 164, .32) transparent; scrollbar-width: thin; }
.node-update::-webkit-scrollbar { width: 5px; }
.node-update::-webkit-scrollbar-thumb { border-radius: 5px; background: rgba(205, 184, 164, .32); }
.node-update strong { display: block; overflow-wrap: anywhere; color: var(--text); font-size: 10px; line-height: 1.2; }
.node-update p { margin: 1px 0 0; overflow-wrap: anywhere; color: var(--muted); font-size: 9px; line-height: 1.2; }
.node-commit { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; min-width: 0; margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--line-soft); }
.node-commit .field-label { flex: 0 0 auto; margin: 0; }
.node-commit code { min-width: 0; overflow: hidden; color: var(--cyan); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.card-action {
  min-width: 0;
  min-height: 28px;
  padding: 5px 6px;
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
  color: var(--muted);
  background: rgba(255, 255, 255, .035);
  cursor: pointer;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-action:hover { border-color: rgba(212, 135, 97, .5); color: var(--text); background: var(--panel-soft); }
.card-action.primary { grid-column: 1 / -1; border-color: transparent; color: #2a1b15; background: var(--cyan); font-weight: 800; }
.card-action.primary:hover { background: #e3a17a; }
.card-action[disabled] { cursor: wait; opacity: .6; }
.detail-panel { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 30px); overflow: hidden; }
.detail-header { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 13px; border-bottom: 1px solid var(--line-soft); }
.detail-heading { min-width: 0; }
.detail-heading .eyebrow { color: var(--cyan); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.detail-heading h2 { margin: 5px 0 2px; overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
.detail-heading p { margin: 0; color: var(--muted); font-size: 10px; }
.close-detail { display: grid; flex: 0 0 auto; place-items: center; width: 26px; height: 26px; margin-left: auto; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; }
.close-detail:hover { color: var(--text); background: var(--panel-soft); }
.detail-tabs { display: flex; gap: 4px; padding: 10px 12px 0; }
.detail-tab { padding: 6px 8px; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 10px; }
.detail-tab:hover { color: var(--text); background: rgba(255, 255, 255, .035); }
.detail-tab.active { border-bottom-color: var(--cyan); color: var(--text); }
.detail-scroll { max-height: calc(100vh - 210px); overflow: auto; padding: 12px 16px 16px; }
.detail-section { margin-top: 14px; }
.detail-section:first-child { margin-top: 0; }
.detail-section h3 { margin: 0 0 6px; color: var(--dim); font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.detail-section p { margin: 0; color: var(--muted); font-size: 11px; white-space: pre-wrap; }
.detail-section p.warning { color: var(--amber); }
.detail-commit-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; padding: 9px; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(255, 255, 255, .025); }
.detail-commit-pair > div { min-width: 0; }
.detail-commit-pair code { display: block; overflow: hidden; color: var(--cyan); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.detail-commit-pair > span { padding-bottom: 1px; color: var(--dim); font-size: 10px; }
.file-list { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.file-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--line-soft); border-radius: 7px; background: rgba(255, 255, 255, .025); font-size: 10px; }
.file-row code { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; }
.file-stats { color: var(--muted); white-space: nowrap; }
.file-stats .add { color: var(--green); }
.file-stats .del { color: var(--danger); }
.relation-list { display: grid; gap: 7px; }
.relation { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line-soft); border-radius: 8px; background: rgba(255, 255, 255, .025); font-size: 10px; }
.relation > span { color: var(--dim); }
.relation button { min-width: 0; overflow: hidden; padding: 0; color: var(--cyan); background: transparent; cursor: pointer; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
.relation button:hover { text-decoration: underline; }
.relation .none { color: var(--dim); }
.comparison-summary { padding: 10px; border: 1px solid rgba(212, 135, 97, .24); border-radius: 9px; color: var(--muted); background: var(--cyan-soft); font-size: 11px; }
.resume-result { margin-top: 14px; padding: 11px; border: 1px solid rgba(111, 231, 174, .3); border-radius: 9px; background: var(--green-soft); }
.resume-result strong { display: block; color: var(--green); font-size: 11px; }
.resume-result p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
.resume-result .handoff-note { margin-top: 8px; padding: 8px; border: 1px solid rgba(247, 200, 115, .24); border-radius: 8px; color: var(--amber); background: rgba(247, 200, 115, .06); }
.resume-grid { display: grid; gap: 6px; margin-top: 8px; }
.resume-grid div { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px; font-size: 10px; }
.resume-grid span { color: var(--dim); }
.resume-grid code { overflow-wrap: anywhere; color: var(--text); }
.resume-actions { display: grid; grid-template-columns: 1fr; gap: 7px; margin-top: 9px; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 12px 16px 16px; border-top: 1px solid var(--line-soft); }
.detail-actions button { min-height: 31px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--panel-soft); cursor: pointer; font-size: 10px; }
.detail-actions button:hover { border-color: rgba(212, 135, 97, .5); color: var(--text); }
.detail-actions button.primary { grid-column: 1 / -1; border-color: transparent; color: #2a1b15; background: var(--cyan); font-weight: 800; }
.detail-actions button[disabled] { cursor: wait; opacity: .6; }
.empty { margin: 18px; padding: 46px 24px; text-align: center; }
.empty .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.empty h1 { margin: 7px 0 4px; font-size: 18px; }
.empty p { margin: 0; color: var(--muted); }
.error-text { color: var(--danger); }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; max-width: min(440px, calc(100vw - 40px)); padding: 10px 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: #17222d; box-shadow: 0 14px 30px rgba(0, 0, 0, .28); opacity: 0; pointer-events: none; transform: translateY(7px); transition: .18s; }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 1050px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 320px; }
}

  .topbar { padding-inline: 13px; }
  .connection { display: none; }
  .workspace { display: block; padding-inline: 13px; }
  .canvas-viewport { max-height: none; }
  .detail-panel { position: fixed; inset: 12px; z-index: 10; max-height: calc(100vh - 24px); }
  .detail-scroll { max-height: calc(100vh - 184px); }
}

  .heading span { max-width: 170px; }
  .graph-tools { flex-wrap: wrap; justify-content: flex-end; }
  .node-card { --node-width: 236px; }
}
/* Full-browser canvas mode: the graph is the page surface, not a card inside it. */
html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

  height: 100vh;
  min-height: 100vh;
  overflow: hidden;
}

  position: relative;
  display: block;
  width: 100%;
  height: calc(100vh - 62px);
  min-height: calc(100vh - 62px);
  padding: 0;
}

  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: none;
  overflow: hidden;
}

  position: absolute;

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const NODE_WIDTH = 236;
const NODE_HEIGHT = 88;
const HORIZONTAL_GAP = 96;
const VERTICAL_GAP = 56;
const CANVAS_PADDING = 32;
const MIN_ZOOM = .25;
const MAX_ZOOM = 2;
const AUTO_REFRESH_INTERVAL = 3000;
const state = {
  payload: null,
  selectedId: null,
  connected: false,
  publishedCommit: null,
  zoom: 1,
  pan: { x: 0, y: 0 },
  autoRefreshTimer: null,
  autoRefreshInFlight: false,
  repositoryRevision: null,
  lastAutoRefreshAt: null,
  centerViewportOnNextRender: false,
  suppressCardClickUntil: 0,
  positions: new Map(),
  bounds: { width: CANVAS_PADDING * 2 + NODE_WIDTH, height: CANVAS_PADDING * 2 + NODE_HEIGHT },
  detailOpen: false,
  detailTab: "overview",
  details: new Map(),
  comparison: null,
  lastResume: null,
  runningAction: null
};

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[char]));
const graph = () => state.payload?.graph ?? null;
const graphNodes = () => graph()?.nodes ?? [];
const baseNode = (id) => graphNodes().find((node) => node.id === id) ?? null;
const selected = () => {
  const node = baseNode(state.selectedId) ?? graphNodes()[0] ?? null;
  if (!node) return null;
  return Object.assign({}, node, state.details.get(node.id) ?? {});
};
const shortSha = (value) => value && value !== "—" ? String(value).slice(0, 8) : "—";
const formatDate = (value) => {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value ?? "—") : date.toLocaleString("zh-CN", { dateStyle: "medium", timeStyle: "short" });
};
const changedFiles = (node) => Array.isArray(node?.changedFiles) ? node.changedFiles : [];
const fileNames = (node) => {
  const files = changedFiles(node);
  if (files.length === 0) return "没有检测到文件差异";
  const names = files.slice(0, 3).map((file) => file.path).join("、");
  return files.length > 3 ? names + " 等 " + files.length + " 个文件" : names;
};
const decisions = (node) => {
  if (Array.isArray(node?.decisions) && node.decisions.length > 0) return node.decisions;
  if (node?.decisions && typeof node.decisions === "string") return [{ title: "关键决策", reason: node.decisions }];
  return [];
};
const decisionText = (node) => {
  const list = decisions(node);
  return list.length ? list.map((decision) => decision.title + ": " + decision.reason).join("；") : "未记录关键决策。";
};
const stats = (node) => {
  if (node?.diffStats) return String(node.diffStats);
  const files = changedFiles(node);
  const additions = files.reduce((total, file) => total + Number(file.additions || 0), 0);
  const deletions = files.reduce((total, file) => total + Number(file.deletions || 0), 0);
  return "+" + additions + " / -" + deletions + " lines";
};
const conversationSummary = (node) => node?.conversationSummary || node?.summary || "暂无已关联的 AI 对话总结。";
const warningText = (node) => node?.warnings || (node?.conversationStatus === "available" ? "无" : "暂无已关联 AI 对话总结");
const parentId = (node) => node?.parentNodeId || node?.gitParent || null;

function notify(message) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => toast.classList.remove("show"), 3200);
}

const browserConfig = (() => {
  const params = new URLSearchParams(window.location?.search ?? "");
  const token = params.get("token");
  const repository = params.get("repository");
  return token && repository ? { token, repository } : null;
})();

function resultValue(result) {
  return result?.structuredContent ?? result?.result?.structuredContent ?? result;
}

function errorFromResult(result) {
  const value = resultValue(result);
  if (result?.isError || (value?.code && value?.message && !value?.graph && !value?.newBranch)) {
    return new Error(value.message || "Trace 操作失败。");
  }
  return null;
}

function renderGraphArguments() {
  if (!browserConfig) throw new Error("Trace Graph 浏览器地址缺少本地服务参数。");
  return { repository: browserConfig.repository, limit: 50, cursor: null };
}

async function callTool(name, args) {
  if (!browserConfig) throw new Error("Trace Graph 浏览器地址缺少本地服务参数。");
  const url = new URL("/api/tool", window.location.href);
  url.searchParams.set("token", browserConfig.token);
  const response = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ name, arguments: args })
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result?.error || "浏览器数据服务请求失败。");
  return result;
}

function resumePrompt(node, result) {
  const data = graph();
  return [
    "[TRACEANDBACK_CONTINUE_REQUEST]",
    "TraceAndBack 已将当前项目工作区切换到历史版本对应的新分支。",
    "请在当前项目工作区手动创建新的开发对话；不需要再次执行 git switch，也不需要创建额外 worktree。",
    "项目：" + (data?.name ?? "当前项目"),
    "源 Trace Card：" + (node?.title ?? "历史版本") + "（" + (node?.commit ?? "—") + "）",
    "新分支：" + result.newBranch,
    "当前项目工作区：" + result.worktreePath,
    "Trace Session：" + result.sessionId,
    "继续策略：" + (result.strategy ?? "branch"),
    "原分支仍保留在原提交，不执行 reset 或覆盖。",
    "[/TRACEANDBACK_CONTINUE_REQUEST]"
  ].join("\n");
}

async function copyResumePrompt() {
  const node = selected();
  const result = state.lastResume;
  if (!node || !result) {
    notify("请先从一个 Trace Card 继续。");
    return;
  }
  const clipboard = globalThis.navigator?.clipboard;
  if (!clipboard?.writeText) {
    notify("当前浏览器不支持复制，请直接使用下方项目工作区路径。");
    return;
  }
  try {
    await clipboard.writeText(resumePrompt(node, result));
    notify("新对话启动信息已复制。");
  } catch {
    notify("复制失败，请直接使用下方项目工作区路径。");
  }
}

function applyGraphResult(result) {
  const payload = resultValue(result);
  if (!payload?.graph || !Array.isArray(payload.graph.nodes)) return false;
  const isInitialGraph = !state.payload;
  const previousSelection = state.selectedId;
  state.payload = payload;
  state.selectedId = payload.graph.nodes.some((node) => node.id === previousSelection)
    ? previousSelection
    : payload.graph.nodes[0]?.id ?? null;
  state.connected = true;
  state.publishedCommit = typeof payload.graph.publishedCommit === "string" ? payload.graph.publishedCommit : null;
  state.repositoryRevision = repositoryRevision(payload.status, payload.graph.publishedCommit);
  state.positions = layoutGraph(payload.graph);
  state.comparison = null;
  state.centerViewportOnNextRender = isInitialGraph;
  render();
  return true;
}

function layoutGraph(data) {
  const nodes = [...(data?.nodes ?? [])];
  const nodeIds = new Set(nodes.map((node) => node.id));
  const nodesById = new Map(nodes.map((node) => [node.id, node]));
  const ordered = nodes.sort((left, right) => {
    const time = new Date(left.createdAt).getTime() - new Date(right.createdAt).getTime();
    if (!Number.isNaN(time) && time !== 0) return time;
    return String(left.id).localeCompare(String(right.id));
  });
  const childrenByGitParent = new Map();
  const roots = [];
  for (const node of ordered) {
    const parent = parentId(node);
    if (!parent || !nodeIds.has(parent)) {
      roots.push(node.id);
      continue;
    }
    const children = childrenByGitParent.get(parent) ?? [];
    children.push(node.id);
    childrenByGitParent.set(parent, children);
  }

  const depthByNode = new Map();
  function depthFor(id, visiting = new Set()) {
    if (depthByNode.has(id)) return depthByNode.get(id);
    if (visiting.has(id)) return 0;
    const node = nodesById.get(id);
    const parent = parentId(node);
    const depth = parent && nodeIds.has(parent)
      ? depthFor(parent, new Set(visiting).add(id)) + 1
      : 0;
    depthByNode.set(id, depth);
    return depth;
  }
  for (const node of ordered) depthFor(node.id);

  const laneByNode = new Map();
  const assigned = new Set();
  const nextLane = { value: 0 };
  function assignLane(id, lane) {
    if (assigned.has(id)) return;
    assigned.add(id);
    laneByNode.set(id, lane);
    const children = childrenByGitParent.get(id) ?? [];
    children.forEach((child, index) => assignLane(child, index === 0 ? lane : ++nextLane.value));
  }
  roots.forEach((id, index) => assignLane(id, index === 0 ? 0 : ++nextLane.value));
  for (const node of ordered) {
    if (!assigned.has(node.id)) assignLane(node.id, ++nextLane.value);
  }

  const positions = new Map();
  ordered.forEach((node) => {
    const depth = depthByNode.get(node.id) ?? 0;
    const lane = laneByNode.get(node.id) ?? 0;
    positions.set(node.id, {
      left: CANVAS_PADDING + depth * (NODE_WIDTH + HORIZONTAL_GAP),
      top: CANVAS_PADDING + lane * (NODE_HEIGHT + VERTICAL_GAP)
    });
  });
  state.bounds = [...positions.values()].reduce((current, position) => ({
    width: Math.max(current.width, position.left + NODE_WIDTH + CANVAS_PADDING),
    height: Math.max(current.height, position.top + NODE_HEIGHT + CANVAS_PADDING)
  }), { width: CANVAS_PADDING * 2 + NODE_WIDTH, height: CANVAS_PADDING * 2 + NODE_HEIGHT });
  return positions;
}

function edgePath(from, to, routeOffset = 0) {
  const source = state.positions.get(from);
  const target = state.positions.get(to);
  if (!source || !target) return null;
  const offset = -9;
  const startX = source.left + NODE_WIDTH + 9;
  const startY = source.top + NODE_HEIGHT / 2 + offset + routeOffset;
  const endX = target.left - 12;
  const endY = target.top + NODE_HEIGHT / 2 + offset + routeOffset;
  const direction = endX >= startX ? 1 : -1;
  const distance = Math.max(48, Math.abs(endX - startX) * .46);
  return "M " + startX + " " + startY + " C " + (startX + distance * direction) + " " + startY + ", " + (endX - distance * direction) + " " + endY + ", " + endX + " " + endY;
}

function graphEdges(data) {
  const paths = (pairs) => {
    const seen = new Set();
    const routesBySource = new Map();
    const routesByTarget = new Map();
    const uniquePairs = (Array.isArray(pairs) ? pairs : []).filter(([from, to]) => {
      const key = from + "->" + to;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    const sourceCounts = new Map();
    const targetCounts = new Map();
    for (const [from, to] of uniquePairs) {
      sourceCounts.set(from, (sourceCounts.get(from) ?? 0) + 1);
      targetCounts.set(to, (targetCounts.get(to) ?? 0) + 1);
    }
    return uniquePairs.map(([from, to]) => {
      const sourceRoute = routesBySource.get(from) ?? 0;
      const targetRoute = routesByTarget.get(to) ?? 0;
      routesBySource.set(from, sourceRoute + 1);
      routesByTarget.set(to, targetRoute + 1);
      const laneCount = Math.max(sourceCounts.get(from) ?? 1, targetCounts.get(to) ?? 1);
      const laneIndex = sourceRoute + targetRoute;
      const routeOffset = laneCount > 1 ? (laneIndex - (laneCount - 1) / 2) * 7 : 0;
      const path = edgePath(from, to, routeOffset);
      const sourceTitle = baseNode(from)?.title || from;
      const targetTitle = baseNode(to)?.title || to;
      const label = "Git ancestry: " + sourceTitle + " → " + targetTitle;
      return path ? '<path class="edge git" data-edge-from="' + esc(from) + '" data-edge-to="' + esc(to) + '" d="' + path + '"><title>' + esc(label) + '</title></path>' : "";
    }).join("");
  };
  return '<svg class="graph-edges" width="' + state.bounds.width + '" height="' + state.bounds.height + '" viewBox="0 0 ' + state.bounds.width + ' ' + state.bounds.height + '" aria-hidden="true"><defs><marker id="edge-origin" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><circle cx="5" cy="5" r="3"></circle></marker><marker id="arrow-git" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d48761"></path></marker></defs>' + paths(data.gitEdges) + "</svg>";
}

function card(node, index) {
  const position = state.positions.get(node.id) ?? { left: CANVAS_PADDING + index * (NODE_WIDTH + HORIZONTAL_GAP), top: CANVAS_PADDING };
  const published = node.commit === state.publishedCommit;
  const active = node.id === state.selectedId ? " selected" : "";
  const publishedClass = published ? " published" : "";
  const update = node.changes || node.goal || node.title || "未记录更新说明";
  return '<article class="node-card' + publishedClass + active + '" data-node="' + esc(node.id) + '" style="left:' + position.left + 'px;top:' + position.top + 'px" aria-label="' + esc(node.title) + ' Trace Card"><div class="node-card-head"><span class="node-icon">◆</span><span class="node-card-label">更新说明</span>' + (published ? '<span class="published-badge" title="已发布到远端仓库">已发布</span>' : '') + '</div><div class="node-time"><span>提交时间</span>' + esc(formatDate(node.createdAt)) + '</div><div class="node-update"><strong title="' + esc(node.title) + '">' + esc(node.title || "未命名版本") + '</strong><p title="' + esc(update) + '">' + esc(update) + '</p></div><div class="node-commit"><span class="field-label">仓库提交编号</span><code title="' + esc(node.commit) + '">' + esc(shortSha(node.commit)) + '</code></div></article>';
}

function relationButton(id, label) {
  if (!id) return '<span class="none">—</span>';
  const node = baseNode(id);
  return node ? '<button data-select="' + esc(id) + '">' + esc(label || node.title) + '</button>' : '<code title="' + esc(id) + '">' + esc(shortSha(id)) + '</code>';
}

function fileRows(node) {
  const files = changedFiles(node);
  if (files.length === 0) return '<p class="empty-value">此版本没有检测到文件差异。</p>';
  return '<ul class="file-list">' + files.map((file) => '<li class="file-row"><code title="' + esc(file.path) + '">' + esc(file.path) + '</code><span class="file-stats"><span class="add">+' + esc(file.additions) + '</span> <span class="del">-' + esc(file.deletions) + '</span></span></li>').join("") + '</ul>';
}

function derivedNodes(node) {
  const data = graph();
  const ids = new Set();
  for (const [from, to] of (data?.gitEdges ?? [])) {
    if (from === node?.id) ids.add(to);
  }
  return [...ids].map((id) => baseNode(id)).filter(Boolean);
}

function detailBody(node) {
  if (state.detailTab === "diff") {
    const comparison = state.comparison?.nodeId === node.id ? state.comparison.value : null;
    const summary = comparison
      ? (comparison.summary || ((comparison.filesChanged ?? 0) + " 个文件发生变化，新增 " + (comparison.additions ?? 0) + " 行，删除 " + (comparison.deletions ?? 0) + " 行。"))
      : "当前提交：" + shortSha(node.commit) + " · 父提交：" + shortSha(node.parent) + "。点击“比较当前”加载经过 Git 校验的文件差异。";
    const fileData = comparison?.files ? Object.assign({}, node, { changedFiles: comparison.files }) : node;
    return '<section class="detail-section"><h3>Code Diff</h3><div class="comparison-summary">' + esc(summary) + '</div></section><section class="detail-section"><h3>Changed Files</h3>' + fileRows(fileData) + '</section>';
  }
  if (state.detailTab === "conversation") {
    const available = node.conversationStatus === "available";
    return '<section class="detail-section"><h3>Conversation</h3><p>' + esc(conversationSummary(node)) + '</p></section><section class="detail-section"><h3>状态</h3><p class="' + (available ? "" : "warning") + '">' + (available ? "已关联 Trace Conversation。" : "暂无已关联的 AI 对话总结；这不会阻断 Git Trace。") + '</p></section>';
  }
  if (state.detailTab === "relations") {
    const derived = derivedNodes(node);
    return '<section class="detail-section"><h3>Parent Node / Derived Nodes</h3><div class="relation-list"><div class="relation"><span>Git Parent</span>' + relationButton(node.gitParent || node.parentNodeId, baseNode(node.gitParent || node.parentNodeId)?.title) + '</div><div class="relation"><span>Derived Nodes</span><span>' + (derived.length ? derived.map((child) => '<button data-select="' + esc(child.id) + '">' + esc(child.title) + '</button>').join("、") : '<span class="none">—</span>') + '</span></div></div></section>';
  }
  return '<section class="detail-section"><h3>本次目标</h3><p>' + esc(node.goal || node.changes || "未记录目标") + '</p></section><section class="detail-section"><h3>AI Discussion Summary</h3><p>' + esc(conversationSummary(node)) + '</p></section><section class="detail-section"><h3>Key Decisions</h3><p>' + esc(decisionText(node)) + '</p></section><section class="detail-section"><h3>Warnings</h3><p class="' + (warningText(node) === "无" ? "" : "warning") + '">' + esc(warningText(node)) + '</p></section>';
}

function detailPanel(node) {
  if (!node || !state.detailOpen) return "";
  const derived = derivedNodes(node);
  const resume = state.lastResume?.sourceNode === node.id ? state.lastResume : null;
  const runningResume = state.runningAction === "resume:" + node.id;
  const resumeMarkup = resume
    ? '<section class="resume-result"><strong>当前工作区已切换</strong><p>当前项目目录已经 checkout 到新分支和目标历史版本；不会创建额外 worktree。现在可以在当前项目中手动创建新的开发对话。</p><div class="handoff-note">不需要再次执行 git switch。若要把本次回退信息带入新对话，请复制启动信息。</div><div class="resume-grid"><div><span>新分支</span><code>' + esc(resume.newBranch) + '</code></div><div><span>项目工作区</span><code>' + esc(resume.worktreePath) + '</code></div><div><span>Session</span><code>' + esc(resume.sessionId) + '</code></div></div><div class="resume-actions"><button class="card-action primary" data-action="copy-resume-prompt" style="width:100%">复制新对话启动信息</button></div></section>'
    : "";
  const relationMarkup = '<section class="detail-section"><h3>当前项目关系</h3><div class="relation-list"><div class="relation"><span>Git Parent</span>' + relationButton(node.gitParent || node.parentNodeId, baseNode(node.gitParent || node.parentNodeId)?.title) + '</div><div class="relation"><span>Derived Nodes</span><span>' + (derived.length ? derived.length + " 个后续节点" : "—") + '</span></div></div></section>';
  return '<aside class="detail-panel" aria-label="Trace Card 详情"><header class="detail-header"><div class="node-icon">◆</div><div class="detail-heading"><div class="eyebrow">Selected Trace Card</div><h2>' + esc(node.title) + '</h2><p>' + esc(formatDate(node.createdAt)) + ' · ' + esc(node.commit) + '</p></div><button class="close-detail" data-action="close-detail" aria-label="关闭详情">×</button></header><nav class="detail-tabs" aria-label="版本详情"><button class="detail-tab ' + (state.detailTab === "overview" ? "active" : "") + '" data-tab="overview">概览</button><button class="detail-tab ' + (state.detailTab === "diff" ? "active" : "") + '" data-tab="diff">Code Diff</button><button class="detail-tab ' + (state.detailTab === "conversation" ? "active" : "") + '" data-tab="conversation">Conversation</button><button class="detail-tab ' + (state.detailTab === "relations" ? "active" : "") + '" data-tab="relations">关系</button></nav><div class="detail-scroll"><div class="detail-commit-pair"><div><span class="field-label">当前提交</span><code title="' + esc(node.commit) + '">' + esc(node.commit) + '</code></div><span>vs.</span><div><span class="field-label">上一历史版本</span><code title="' + esc(node.parent) + '">' + esc(node.parent) + '</code></div></div>' + detailBody(node) + resumeMarkup + relationMarkup + '</div><div class="detail-actions"><button data-action="details" data-node="' + esc(node.id) + '">同步完整详情</button><button data-action="compare" data-node="' + esc(node.id) + '">比较当前</button><button class="primary" data-action="resume" data-node="' + esc(node.id) + '" ' + (runningResume ? "disabled" : "") + '>' + (runningResume ? "正在切换当前工作区…" : "从此版本继续") + '</button></div></aside>';
}

function updateCanvasTransform() {
  const world = document.querySelector(".canvas-world");
  if (!world) return;
  world.style.transform = "translate(" + state.pan.x + "px, " + state.pan.y + "px) scale(" + state.zoom + ")";
}

function repositoryRevision(status, publishedCommit = null) {
  if (!status || typeof status !== "object") return null;
  return [
    status.head ?? "—",
    status.branch ?? "—",
    status.dirty ? "dirty" : "clean",
    status.untrackedCount ?? 0,
    status.operationState ?? "none",
    status.publishedCommit ?? publishedCommit ?? ""
  ].join("|");
}

async function refreshGraphAutomatically() {
  if (!browserConfig || !state.payload || state.autoRefreshInFlight) return;
  state.autoRefreshInFlight = true;
  try {
    const result = await callTool("trace.get_status", { repository: browserConfig.repository });
    const error = errorFromResult(result);
    if (error) throw error;
    const revision = repositoryRevision(resultValue(result));
    if (!revision || revision === state.repositoryRevision) return;
    const refreshed = await callTool("trace.render_graph", renderGraphArguments());
    const refreshError = errorFromResult(refreshed);
    if (refreshError) throw refreshError;
    if (!applyGraphResult(refreshed)) throw new Error("自动更新返回了无效的 Trace Graph。");
    state.lastAutoRefreshAt = Date.now();
    notify("检测到仓库更新，Trace 图已自动同步。");
  } catch {
    // Keep the current graph usable; the manual refresh action remains available.
  } finally {
    state.autoRefreshInFlight = false;
  }
}

function startAutoRefresh() {
  if (!browserConfig || state.autoRefreshTimer !== null || typeof window.setInterval !== "function") return;
  state.autoRefreshTimer = window.setInterval(() => {
    void refreshGraphAutomatically();
  }, AUTO_REFRESH_INTERVAL);
}

function centerCanvasWorld(centerViewport = false) {
  const viewport = document.querySelector(".canvas-viewport");
  const world = viewport?.querySelector?.(".canvas-world");
  if (!viewport || !world) return;
  const scaledWidth = state.bounds.width * state.zoom;
  const scaledHeight = state.bounds.height * state.zoom;
  if (centerViewport) {
    state.pan = {
      x: (viewport.clientWidth - scaledWidth) / 2,
      y: (viewport.clientHeight - scaledHeight) / 2
    };
  }
  updateCanvasTransform();
}

function render() {
  const root = document.getElementById("app");
  const data = graph();
  if (!data) {
    const heading = browserConfig ? "正在读取当前项目的 Git 历史…" : "浏览器地址无效";
    const description = browserConfig
      ? "正在连接本机 Trace 数据服务。"
      : "请从 TraceAndBack 工具重新打开项目图谱。";
    root.innerHTML = "<main class=\"empty\"><div class=\"eyebrow\">TraceAndBack Browser</div><h1>" + heading + "</h1><p>" + description + "</p></main>";
    return;
  }
  const nodes = graphNodes();
  const current = selected();
  const worldStyle = "width:" + state.bounds.width + "px;height:" + state.bounds.height + "px";
  const emptyOrGraph = nodes.length === 0
    ? "<main class=\"empty\"><div class=\"eyebrow\">Repository connected</div><h1>当前项目还没有 Trace Card</h1><p>创建第一个 Git 提交后点击刷新，版本卡会出现在项目图中。</p></main>"
    : "<main class=\"workspace\"><div class=\"canvas-zoom-tools\" aria-label=\"缩放控制\"><div class=\"graph-tools\"><button class=\"graph-tool\" data-action=\"zoom-out\" aria-label=\"缩小\">−</button><span class=\"zoom-label\">" + Math.round(state.zoom * 100) + "%</span><button class=\"graph-tool\" data-action=\"zoom-in\" aria-label=\"放大\">＋</button><button class=\"graph-tool\" data-action=\"zoom-reset\" aria-label=\"重置缩放\">⌂</button></div></div><div class=\"canvas-viewport\" aria-label=\"项目版本图谱，可拖动和缩放\"><div class=\"canvas-world\" style=\"" + worldStyle + "\">" + graphEdges(data) + nodes.map(card).join("") + "</div></div>" + detailPanel(current) + "</main>";
  root.innerHTML = "<div class=\"shell\"><header class=\"topbar\"><div class=\"brand-mark\">↗</div><div class=\"heading\"><strong>" + esc(data.name) + " · Project Trace Graph</strong><span>" + esc(data.branch) + " · " + esc(data.status) + "</span></div><div class=\"topbar-spacer\"></div><div class=\"connection\">" + (state.connected ? "本地数据服务 · 自动同步" : "连接中") + "</div><button class=\"toolbar-button\" data-action=\"refresh\">刷新</button></header>" + emptyOrGraph + "</div>";
  const viewport = root.querySelector(".canvas-viewport");
  if (viewport) {
    const centerViewport = state.centerViewportOnNextRender;
    centerCanvasWorld(centerViewport);
    if (centerViewport) {
      state.centerViewportOnNextRender = false;
    }
  }
  bindCanvasGestures();
}

function clampZoom(value) {
  return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, value));
}

function zoomAtPointer(nextZoom, clientX, clientY) {
  const viewport = document.querySelector(".canvas-viewport");
  const zoom = clampZoom(nextZoom);
  if (!viewport) {
    state.zoom = zoom;
    render();
    return;
  }
  if (zoom === state.zoom) return;
  const rect = viewport.getBoundingClientRect();
  const pointerX = Math.min(Math.max(clientX - rect.left, 0), rect.width);
  const pointerY = Math.min(Math.max(clientY - rect.top, 0), rect.height);
  const worldX = (pointerX - state.pan.x) / state.zoom;
  const worldY = (pointerY - state.pan.y) / state.zoom;
  state.zoom = zoom;
  state.pan = {
    x: pointerX - worldX * zoom,
    y: pointerY - worldY * zoom
  };
  render();
}

function zoomAtViewportCenter(nextZoom) {
  const viewport = document.querySelector(".canvas-viewport");
  if (!viewport) {
    state.zoom = clampZoom(nextZoom);
    render();
    return;
  }
  const rect = viewport.getBoundingClientRect();
  zoomAtPointer(clampZoom(nextZoom), rect.left + rect.width / 2, rect.top + rect.height / 2);
}

async function act(action, nodeId, relation) {
  const node = nodeId ? baseNode(nodeId) : selected();
  try {
    if (action === "refresh") {
      const result = await callTool("trace.render_graph", renderGraphArguments());
      const error = errorFromResult(result);
      if (error) throw error;
      if (!applyGraphResult(result)) throw new Error("Trace Graph 返回了无效数据。");
      startAutoRefresh();
      notify("项目 Trace Graph 已刷新。");
      return;
    }
    if (action === "close-detail") {
      state.detailOpen = false;
      render();
      return;
    }
    if (action === "zoom-in") {
      zoomAtViewportCenter(state.zoom + .1);
      return;
    }
    if (action === "zoom-out") {
      zoomAtViewportCenter(state.zoom - .1);
      return;
    }
    if (action === "zoom-reset") {
      zoomAtViewportCenter(1);
      return;
    }
    if (action === "copy-resume-prompt") {
      await copyResumePrompt();
      return;
    }
    if (!node) return;
    state.selectedId = node.id;
    state.detailOpen = true;
    if (action === "details") {
      state.runningAction = "details:" + node.id;
      render();
      const result = await callTool("trace.get_node", { nodeId: node.id });
      const error = errorFromResult(result);
      if (error) throw error;
      const value = resultValue(result);
      if (value && value.id) state.details.set(node.id, value);
      state.runningAction = null;
      state.detailTab = "overview";
      render();
      notify("版本详情已同步。");
      return;
    }
    if (action === "compare") {
      const fromNode = node.parentNodeId || node.gitParent;
      if (!fromNode) {
        notify("初始版本没有可比较的父版本。");
        render();
        return;
      }
      state.runningAction = "compare:" + node.id;
      state.detailTab = "diff";
      render();
      const result = await callTool("trace.compare", { fromNode, toNode: node.id });
      const error = errorFromResult(result);
      if (error) throw error;
      state.comparison = { nodeId: node.id, value: resultValue(result) };
      state.runningAction = null;
      render();
      notify("Code Diff 已加载。");
      return;
    }
    if (action === "resume") {
      state.runningAction = "resume:" + node.id;
      render();
      const result = await callTool("trace.resume_from", { nodeId: node.id, strategy: "branch", checkpointCurrent: false });
      const error = errorFromResult(result);
      if (error) throw error;
      const value = resultValue(result);
      if (!value?.newBranch || !value?.worktreePath) throw new Error("恢复操作没有返回可验证的工作区。");
      state.lastResume = value;
      state.runningAction = null;
      state.detailTab = "overview";
      try {
        const refreshed = await callTool("trace.render_graph", renderGraphArguments());
        if (!errorFromResult(refreshed)) applyGraphResult(refreshed);
      } catch {
        // The Git operation already succeeded; the user can refresh the browser page.
      }
      render();
      notify("已从 " + shortSha(node.commit) + " 将当前工作区切换到新分支：" + value.newBranch + "。现在可手动创建新对话。");
    }
  } catch (error) {
    state.runningAction = null;
    render();
    notify("操作失败：" + (error?.message ?? "未知错误"));
  }
}

async function loadInitialGraph() {
  if (!browserConfig) {
    render();
    return;
  }
  state.runningAction = "initial-load";
  render();
  try {
    const result = await callTool("trace.render_graph", renderGraphArguments());
    const error = errorFromResult(result);
    if (error) throw error;
    if (!applyGraphResult(result)) throw new Error("Trace Graph 返回了无效数据。");
    startAutoRefresh();
  } catch (error) {
    state.connected = false;
    notify("加载失败：" + (error?.message ?? "无法连接本地数据服务。"));
  } finally {
    state.runningAction = null;
    render();
  }
}

function bindApp() {
  const root = document.getElementById("app");
  root.addEventListener("click", (event) => {
    const source = event.target;
    const actionButton = source?.closest?.("[data-action]");
    if (actionButton) {
      event.preventDefault();
      event.stopPropagation();
      void act(actionButton.dataset.action, actionButton.dataset.node, actionButton.dataset.relation);
      return;
    }
    const tab = source?.closest?.("[data-tab]");
    if (tab) {
      state.detailTab = tab.dataset.tab;
      render();
      return;
    }
    const related = source?.closest?.("[data-select]");
    if (related) {
      state.selectedId = related.dataset.select;
      state.detailOpen = true;
      state.detailTab = "overview";
      state.comparison = null;
      render();
      return;
    }
    const nodeCard = source?.closest?.(".node-card");
    if (nodeCard) {
      if (state.suppressCardClickUntil > performance.now()) {
        state.suppressCardClickUntil = 0;
        event.preventDefault();
        return;
      }
      state.selectedId = nodeCard.dataset.node;
      state.detailOpen = true;
      state.detailTab = "overview";
      state.comparison = null;
      render();
    }
  });
  bindCanvasGestures();
}

function bindCanvasGestures() {
  const viewport = document.querySelector(".canvas-viewport");
  if (!viewport) return;
  let drag = null;

  viewport.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    const target = event.target instanceof Element ? event.target : null;
    if (target?.closest("button, a, input, textarea, select")) return;
    drag = {
      x: event.clientX,
      y: event.clientY,
      panX: state.pan.x,
      panY: state.pan.y,
      card: Boolean(target?.closest(".node-card")),
      moved: false
    };
    viewport.classList.add("is-dragging");
  });

  viewport.addEventListener("pointermove", (event) => {
    if (!drag) return;
    if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) {
      drag.moved = true;
      if (!drag.captured) {
        viewport.setPointerCapture(event.pointerId);
        drag.captured = true;
      }
    }
    event.preventDefault();
    state.pan.x = drag.panX + event.clientX - drag.x;
    state.pan.y = drag.panY + event.clientY - drag.y;
    updateCanvasTransform();
  });

  const stopDragging = () => {
    if (!drag) return;
    if (drag.card && drag.moved) state.suppressCardClickUntil = performance.now() + 500;
    drag = null;
    viewport.classList.remove("is-dragging");
  };
  viewport.addEventListener("pointerup", stopDragging);
  viewport.addEventListener("pointercancel", stopDragging);
  viewport.addEventListener("lostpointercapture", stopDragging);

  viewport.addEventListener("wheel", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    if (target?.closest(".node-update")) return;
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : .9;
    zoomAtPointer(state.zoom * factor, event.clientX, event.clientY);
  }, { passive: false });
}

bindApp();
window.addEventListener("resize", centerCanvasWorld);
render();
void loadInitialGraph();
</script>
