<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceAndBack · Project Trace Graph</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080b11;
  --panel: #111722;
  --panel-raised: #171f2d;
  --panel-soft: #1c2635;
  --line: #2b394b;
  --line-soft: rgba(148, 163, 184, .16);
  --text: #eef4f8;
  --muted: #94a3b8;
  --dim: #64748b;
  --cyan: #68d9ef;
  --cyan-soft: rgba(104, 217, 239, .12);
  --violet: #a394ff;
  --green: #6fe7ae;
  --green-soft: rgba(111, 231, 174, .1);
  --amber: #f7c873;
  --danger: #ff8e9d;
  --node-width: 304px;
  --node-height: 414px;
  --shadow: 0 20px 50px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
button { border: 0; font: inherit; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }

.shell {
  min-height: 100vh;
  background:
    radial-gradient(circle at 76% -10%, rgba(104, 217, 239, .11), transparent 30%),
    radial-gradient(circle at 20% 110%, rgba(163, 148, 255, .08), transparent 36%),
    var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 62px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line-soft);
  background: rgba(8, 11, 17, .9);
  backdrop-filter: blur(16px);
}
.brand-mark {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  color: #061014;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  font-weight: 900;
  box-shadow: 0 0 22px rgba(104, 217, 239, .18);
}
.heading { min-width: 0; }
.heading strong, .heading span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heading strong { font-size: 13px; }
.heading span { margin-top: 1px; color: var(--muted); font-size: 11px; }
.topbar-spacer { flex: 1; }
.connection {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--green);
  font-size: 11px;
  white-space: nowrap;
}
.connection::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  content: "";
}
.toolbar-button {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  background: var(--panel-soft);
  cursor: pointer;
}
.toolbar-button:hover { border-color: rgba(104, 217, 239, .55); background: #223044; }

.summary-strip {
  display: grid;
  grid-template-columns: minmax(130px, 1fr) minmax(160px, 1.25fr) minmax(160px, 1fr) minmax(170px, 1.35fr);
  gap: 9px;
  padding: 14px 18px;
}
.stat {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  background: rgba(17, 23, 34, .86);
}
.stat strong, .stat span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat strong { font-size: 15px; }
.stat span { margin-top: 2px; color: var(--muted); font-size: 10px; }
.stat.dirty strong { color: var(--amber); }
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 354px;
  gap: 14px;
  padding: 0 18px 18px;
}
.graph-panel, .detail-panel, .empty {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(17, 23, 34, .93);
  box-shadow: var(--shadow);
}
.graph-panel { min-width: 0; overflow: hidden; }
.graph-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--line-soft);
}
.graph-toolbar h1 { margin: 0; font-size: 13px; }
.graph-toolbar p { margin: 2px 0 0; color: var(--muted); font-size: 10px; }
.graph-toolbar-copy { min-width: 0; }
.graph-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.graph-tool {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}
.graph-tool:hover { color: var(--text); background: var(--panel-soft); }
.zoom-label { min-width: 42px; color: var(--muted); text-align: center; font-size: 10px; }
.legend { display: flex; align-items: center; gap: 11px; margin-left: 9px; color: var(--muted); font-size: 10px; white-space: nowrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 17px; border-top: 2px solid var(--cyan); }
.legend i.chronology { border-top-color: var(--violet); border-top-style: dashed; }

.canvas-viewport {
  position: relative;
  min-height: 560px;
  max-height: calc(100vh - 205px);
  overflow: auto;
  background-color: #0c1119;
  background-image:
    linear-gradient(rgba(148, 163, 184, .055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .055) 1px, transparent 1px),
    radial-gradient(circle at 50% 25%, rgba(104, 217, 239, .06), transparent 34%);
  background-size: 32px 32px, 32px 32px, auto;
}
.canvas-viewport::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(12, 17, 25, 0) 70%, rgba(12, 17, 25, .55));
  content: "";
}
.canvas-world { position: relative; min-width: 980px; min-height: 560px; }
.graph-edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
.edge.git { stroke: rgba(104, 217, 239, .72); marker-end: url(#arrow-git); }
.edge.chronology { stroke: rgba(163, 148, 255, .78); stroke-dasharray: 5 6; marker-end: url(#arrow-chronology); }
.node-card {
  position: absolute;
  display: flex;
  flex-direction: column;
  width: var(--node-width);
  min-height: var(--node-height);
  padding: 13px;
  border: 1px solid #34465a;
  border-radius: 12px;
  background: linear-gradient(150deg, #192535, #121a26 72%);
  box-shadow: 0 16px 34px rgba(0, 0, 0, .3), inset 0 1px rgba(255, 255, 255, .035);
  cursor: pointer;
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.node-card::before {
  position: absolute;
  top: 17px;
  left: -5px;
  width: 8px;
  height: 8px;
  border: 2px solid #0c1119;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan), 0 0 16px rgba(104, 217, 239, .32);
  content: "";
}
.node-card:hover, .node-card.selected {
  border-color: var(--cyan);
  box-shadow: 0 20px 42px rgba(0, 0, 0, .36), 0 0 0 1px rgba(104, 217, 239, .16);
}
.node-card.selected { background: linear-gradient(150deg, #1b303a, #121e28 72%); }
.node-card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.node-kicker { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--cyan); font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
.node-kicker span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-icon { display: grid; flex: 0 0 auto; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: var(--cyan); background: var(--cyan-soft); font-size: 11px; }
.node-menu { display: grid; flex: 0 0 auto; place-items: center; width: 23px; height: 23px; margin-left: auto; border-radius: 6px; color: var(--dim); background: transparent; cursor: pointer; }
.node-menu:hover { color: var(--text); background: var(--panel-soft); }
.node-card h2 { margin: 9px 0 0; overflow: hidden; font-size: 14px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.node-time { margin-top: 2px; color: var(--muted); font-size: 10px; }
.commit-block { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 11px; }
.commit-cell { min-width: 0; padding: 7px 8px; border: 1px solid var(--line-soft); border-radius: 8px; background: rgba(255, 255, 255, .025); }
.field-label { display: block; margin-bottom: 3px; color: var(--dim); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.commit-cell code { display: block; overflow: hidden; color: var(--cyan); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.card-field { min-width: 0; margin-top: 9px; }
.card-field p { display: -webkit-box; overflow: hidden; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.38; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.card-field p.one-line { -webkit-line-clamp: 1; }
.card-field p.warning { color: var(--amber); }
.card-field p.empty-value { color: var(--dim); }
.card-field .decision { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 10px; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 9px; }
.metric { min-width: 0; padding-top: 7px; border-top: 1px solid var(--line-soft); }
.metric strong { display: block; overflow: hidden; color: var(--text); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.metric span { display: block; margin-top: 2px; color: var(--dim); font-size: 9px; }
.node-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; padding-top: 11px; }
.card-action {
  min-width: 0;
  min-height: 28px;
  padding: 5px 6px;
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
  color: var(--muted);
  background: rgba(255, 255, 255, .035);
  cursor: pointer;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-action:hover { border-color: rgba(104, 217, 239, .55); color: var(--text); background: var(--panel-soft); }
.card-action.primary { grid-column: 1 / -1; border-color: transparent; color: #071014; background: var(--cyan); font-weight: 800; }
.card-action.primary:hover { background: #8de7f6; }
.card-action[disabled] { cursor: wait; opacity: .6; }
.detail-panel { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 30px); overflow: hidden; }
.detail-header { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 13px; border-bottom: 1px solid var(--line-soft); }
.detail-heading { min-width: 0; }
.detail-heading .eyebrow { color: var(--cyan); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.detail-heading h2 { margin: 5px 0 2px; overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
.detail-heading p { margin: 0; color: var(--muted); font-size: 10px; }
.close-detail { display: grid; flex: 0 0 auto; place-items: center; width: 26px; height: 26px; margin-left: auto; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; }
.close-detail:hover { color: var(--text); background: var(--panel-soft); }
.detail-tabs { display: flex; gap: 4px; padding: 10px 12px 0; }
.detail-tab { padding: 6px 8px; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 10px; }
.detail-tab:hover { color: var(--text); background: rgba(255, 255, 255, .035); }
.detail-tab.active { border-bottom-color: var(--cyan); color: var(--text); }
.detail-scroll { max-height: calc(100vh - 210px); overflow: auto; padding: 12px 16px 16px; }
.detail-section { margin-top: 14px; }
.detail-section:first-child { margin-top: 0; }
.detail-section h3 { margin: 0 0 6px; color: var(--dim); font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.detail-section p { margin: 0; color: var(--muted); font-size: 11px; white-space: pre-wrap; }
.detail-section p.warning { color: var(--amber); }
.detail-commit-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; padding: 9px; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(255, 255, 255, .025); }
.detail-commit-pair > div { min-width: 0; }
.detail-commit-pair code { display: block; overflow: hidden; color: var(--cyan); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.detail-commit-pair > span { padding-bottom: 1px; color: var(--dim); font-size: 10px; }
.file-list { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.file-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--line-soft); border-radius: 7px; background: rgba(255, 255, 255, .025); font-size: 10px; }
.file-row code { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; }
.file-stats { color: var(--muted); white-space: nowrap; }
.file-stats .add { color: var(--green); }
.file-stats .del { color: var(--danger); }
.relation-list { display: grid; gap: 7px; }
.relation { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line-soft); border-radius: 8px; background: rgba(255, 255, 255, .025); font-size: 10px; }
.relation > span { color: var(--dim); }
.relation button { min-width: 0; overflow: hidden; padding: 0; color: var(--cyan); background: transparent; cursor: pointer; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
.relation button:hover { text-decoration: underline; }
.relation .none { color: var(--dim); }
.comparison-summary { padding: 10px; border: 1px solid rgba(104, 217, 239, .25); border-radius: 9px; color: var(--muted); background: var(--cyan-soft); font-size: 11px; }
.resume-result { margin-top: 14px; padding: 11px; border: 1px solid rgba(111, 231, 174, .3); border-radius: 9px; background: var(--green-soft); }
.resume-result strong { display: block; color: var(--green); font-size: 11px; }
.resume-result p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
.resume-grid { display: grid; gap: 6px; margin-top: 8px; }
.resume-grid div { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px; font-size: 10px; }
.resume-grid span { color: var(--dim); }
.resume-grid code { overflow-wrap: anywhere; color: var(--text); }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 12px 16px 16px; border-top: 1px solid var(--line-soft); }
.detail-actions button { min-height: 31px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--panel-soft); cursor: pointer; font-size: 10px; }
.detail-actions button:hover { border-color: rgba(104, 217, 239, .55); color: var(--text); }
.detail-actions button.primary { grid-column: 1 / -1; border-color: transparent; color: #071014; background: var(--cyan); font-weight: 800; }
.detail-actions button[disabled] { cursor: wait; opacity: .6; }
.empty { margin: 18px; padding: 46px 24px; text-align: center; }
.empty .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.empty h1 { margin: 7px 0 4px; font-size: 18px; }
.empty p { margin: 0; color: var(--muted); }
.error-text { color: var(--danger); }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; max-width: min(440px, calc(100vw - 40px)); padding: 10px 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: #17212e; box-shadow: 0 16px 40px rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transform: translateY(7px); transition: .18s; }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 1050px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 320px; }
  .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .legend { display: none; }
}
@media (max-width: 780px) {
  .topbar { padding-inline: 13px; }
  .connection { display: none; }
  .summary-strip { grid-template-columns: 1fr 1fr; padding-inline: 13px; }
  .workspace { display: block; padding-inline: 13px; }
  .graph-panel { min-height: 560px; }
  .canvas-viewport { max-height: none; }
  .detail-panel { position: fixed; inset: 12px; z-index: 10; max-height: calc(100vh - 24px); }
  .detail-scroll { max-height: calc(100vh - 184px); }
}
@media (max-width: 520px) {
  .summary-strip { grid-template-columns: 1fr; }
  .heading span { max-width: 170px; }
  .graph-toolbar { align-items: flex-start; }
  .graph-tools { flex-wrap: wrap; justify-content: flex-end; }
  .node-card { --node-width: 286px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const NODE_WIDTH = 304;
const NODE_HEIGHT = 414;
const HORIZONTAL_GAP = 104;
const VERTICAL_GAP = 78;
const state = {
  payload: null,
  selectedId: null,
  connected: false,
  pending: new Map(),
  nextId: 1,
  zoom: 1,
  positions: new Map(),
  bounds: { width: 980, height: 560 },
  detailOpen: false,
  detailTab: "overview",
  details: new Map(),
  comparison: null,
  lastResume: null,
  runningAction: null
};

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[char]));
const graph = () => state.payload?.graph ?? null;
const graphNodes = () => graph()?.nodes ?? [];
const baseNode = (id) => graphNodes().find((node) => node.id === id) ?? null;
const selected = () => {
  const node = baseNode(state.selectedId) ?? graphNodes()[0] ?? null;
  if (!node) return null;
  return Object.assign({}, node, state.details.get(node.id) ?? {});
};
const shortSha = (value) => value && value !== "—" ? String(value).slice(0, 8) : "—";
const formatDate = (value) => {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value ?? "—") : date.toLocaleString("zh-CN", { dateStyle: "medium", timeStyle: "short" });
};
const changedFiles = (node) => Array.isArray(node?.changedFiles) ? node.changedFiles : [];
const fileNames = (node) => {
  const files = changedFiles(node);
  if (files.length === 0) return "没有检测到文件差异";
  const names = files.slice(0, 3).map((file) => file.path).join("、");
  return files.length > 3 ? names + " 等 " + files.length + " 个文件" : names;
};
const decisions = (node) => {
  if (Array.isArray(node?.decisions) && node.decisions.length > 0) return node.decisions;
  if (node?.decisions && typeof node.decisions === "string") return [{ title: "关键决策", reason: node.decisions }];
  return [];
};
const decisionText = (node) => {
  const list = decisions(node);
  return list.length ? list.map((decision) => decision.title + ": " + decision.reason).join("；") : "未记录关键决策。";
};
const stats = (node) => {
  if (node?.diffStats) return String(node.diffStats);
  const files = changedFiles(node);
  const additions = files.reduce((total, file) => total + Number(file.additions || 0), 0);
  const deletions = files.reduce((total, file) => total + Number(file.deletions || 0), 0);
  return "+" + additions + " / -" + deletions + " lines";
};
const conversationSummary = (node) => node?.conversationSummary || node?.summary || "暂无已关联的 AI 对话总结。";
const warningText = (node) => node?.warnings || (node?.conversationStatus === "available" ? "无" : "暂无已关联 AI 对话总结");
const parentId = (node) => node?.parentNodeId || node?.gitParent || null;

function notify(message) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => toast.classList.remove("show"), 3200);
}

function bridgeValue(result) {
  return result?.structuredContent ?? result?.result?.structuredContent ?? result;
}

function errorFromResult(result) {
  const value = bridgeValue(result);
  if (result?.isError || (value?.code && value?.message && !value?.graph && !value?.newBranch)) {
    return new Error(value.message || "Trace 操作失败。");
  }
  return null;
}

function requestHost(method, params) {
  if (window.parent === window) return Promise.reject(new Error("MCP Apps host bridge unavailable"));
  const id = state.nextId++;
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      if (state.pending.delete(id)) reject(new Error("宿主请求超时。"));
    }, 8000);
    state.pending.set(id, {
      resolve: (value) => {
        clearTimeout(timer);
        resolve(value);
      },
      reject: (error) => {
        clearTimeout(timer);
        reject(error);
      }
    });
  });
}

function callTool(name, args) {
  const api = window.openai;
  if (api && typeof api.callTool === "function") return api.callTool(name, args);
  return requestHost("tools/call", { name, arguments: args });
}

function sendHostMessage(prompt) {
  const api = window.openai;
  if (api && typeof api.sendFollowUpMessage === "function") return api.sendFollowUpMessage({ prompt });
  if (window.parent !== window) {
    return requestHost("ui/message", { role: "user", content: [{ type: "text", text: prompt }] });
  }
  return Promise.reject(new Error("当前宿主没有提供新对话消息接口。"));
}

function continuationPrompt(node, result) {
  const data = graph();
  return [
    "TraceAndBack 已完成 Continue From，请在新环境中开始后续开发。",
    "项目：" + (data?.name ?? "当前项目"),
    "源 Trace Card：" + (node?.title ?? "历史版本") + "（" + (node?.commit ?? "—") + "）",
    "新分支：" + result.newBranch,
    "新工作区：" + result.worktreePath,
    "Trace Session：" + result.sessionId,
    "请打开一个新的开发对话，并将该对话的工作区设置为上面的 worktree/分支。保留原项目工作区与原分支，不执行 reset 或覆盖。"
  ].join("\n");
}

async function handoffResume() {
  const node = selected();
  const result = state.lastResume;
  if (!node || !result) {
    notify("请先从一个 Trace Card 继续。");
    return;
  }
  try {
    await sendHostMessage(continuationPrompt(node, result));
    notify("已把新分支和工作区交给宿主，可继续打开新的开发对话。");
  } catch (error) {
    notify(error?.message ?? "无法通知宿主打开新对话，请使用下方工作区路径。");
  }
}

function applyHostGraph(result) {
  const payload = bridgeValue(result);
  if (!payload?.graph || !Array.isArray(payload.graph.nodes)) return false;
  const previousSelection = state.selectedId;
  state.payload = payload;
  state.selectedId = payload.graph.nodes.some((node) => node.id === previousSelection)
    ? previousSelection
    : payload.graph.nodes[0]?.id ?? null;
  state.connected = true;
  state.positions = layoutGraph(payload.graph);
  state.comparison = null;
  render();
  return true;
}

function layoutGraph(data) {
  const nodes = [...(data?.nodes ?? [])];
  const nodeIds = new Set(nodes.map((node) => node.id));
  const ordered = nodes.sort((left, right) => {
    const time = new Date(left.createdAt).getTime() - new Date(right.createdAt).getTime();
    return Number.isNaN(time) ? 0 : time;
  });
  const childrenByGitParent = new Map();
  for (const node of ordered) {
    const parent = parentId(node);
    if (!parent || !nodeIds.has(parent)) continue;
    const children = childrenByGitParent.get(parent) ?? [];
    children.push(node.id);
    childrenByGitParent.set(parent, children);
  }
  const laneByNode = new Map();
  const nextLane = { value: 0 };
  for (const node of ordered) {
    const parent = parentId(node);
    const parentLane = parent ? laneByNode.get(parent) : undefined;
    const siblings = parent ? childrenByGitParent.get(parent) ?? [] : [];
    const siblingIndex = siblings.indexOf(node.id);
    const lane = parentLane !== undefined && siblingIndex <= 0 ? parentLane : nextLane.value++;
    laneByNode.set(node.id, lane);
    nextLane.value = Math.max(nextLane.value, lane + 1);
  }
  const positions = new Map();
  ordered.forEach((node, index) => {
    const lane = laneByNode.get(node.id) ?? 0;
    positions.set(node.id, {
      left: 56 + index * (NODE_WIDTH + HORIZONTAL_GAP),
      top: 72 + lane * (NODE_HEIGHT + VERTICAL_GAP)
    });
  });
  state.bounds = [...positions.values()].reduce((current, position) => ({
    width: Math.max(current.width, position.left + NODE_WIDTH + 84),
    height: Math.max(current.height, position.top + NODE_HEIGHT + 84)
  }), { width: 980, height: 560 });
  return positions;
}

function edgePath(from, to, kind) {
  const source = state.positions.get(from);
  const target = state.positions.get(to);
  if (!source || !target) return null;
  const offset = kind === "git" ? -9 : 9;
  const startX = source.left + NODE_WIDTH;
  const startY = source.top + NODE_HEIGHT / 2 + offset;
  const endX = target.left;
  const endY = target.top + NODE_HEIGHT / 2 + offset;
  const direction = endX >= startX ? 1 : -1;
  const distance = Math.max(48, Math.abs(endX - startX) * .46);
  return "M " + startX + " " + startY + " C " + (startX + distance * direction) + " " + startY + ", " + (endX - distance * direction) + " " + endY + ", " + endX + " " + endY;
}

function graphEdges(data) {
  const paths = (pairs, kind) => (Array.isArray(pairs) ? pairs : []).map(([from, to]) => {
    const path = edgePath(from, to, kind);
    return path ? '<path class="edge ' + kind + '" d="' + path + '"><title>' + (kind === "git" ? "Git ancestry" : "Chronology") + '</title></path>' : "";
  }).join("");
  return '<svg class="graph-edges" width="' + state.bounds.width + '" height="' + state.bounds.height + '" viewBox="0 0 ' + state.bounds.width + ' ' + state.bounds.height + '" aria-hidden="true"><defs><marker id="arrow-git" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68d9ef"></path></marker><marker id="arrow-chronology" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a394ff"></path></marker></defs>' + paths(data.gitEdges, "git") + paths(data.chronologyEdges, "chronology") + "</svg>";
}

function card(node, index) {
  const position = state.positions.get(node.id) ?? { left: 56 + index * (NODE_WIDTH + HORIZONTAL_GAP), top: 72 };
  const active = node.id === state.selectedId ? " selected" : "";
  const files = changedFiles(node);
  const warning = warningText(node);
  const resumeLoading = state.runningAction === "resume:" + node.id;
  return '<article class="node-card' + active + '" data-node="' + esc(node.id) + '" style="left:' + position.left + 'px;top:' + position.top + 'px" aria-label="' + esc(node.title) + ' Trace Card"><div class="node-card-head"><div class="node-kicker"><span class="node-icon">◆</span><span>Trace Card · ' + esc(node.round || "Git version") + '</span></div><button class="node-menu" data-action="details" data-node="' + esc(node.id) + '" aria-label="查看版本详情">•••</button></div><h2>' + esc(node.title) + '</h2><div class="node-time">' + esc(formatDate(node.createdAt)) + '</div><div class="commit-block"><div class="commit-cell"><span class="field-label">Commit SHA</span><code title="' + esc(node.commit) + '">' + esc(shortSha(node.commit)) + '</code></div><div class="commit-cell"><span class="field-label">Git Parent</span><code title="' + esc(node.parent) + '">' + esc(shortSha(node.parent)) + '</code></div></div><div class="card-field"><span class="field-label">本次目标</span><p>' + esc(node.goal || node.changes || "未记录目标") + '</p></div><div class="card-field"><span class="field-label">AI Discussion Summary</span><p>' + esc(conversationSummary(node)) + '</p></div><div class="card-field"><span class="field-label">Key Decisions</span><p class="decision">' + esc(decisionText(node)) + '</p></div><div class="card-field"><span class="field-label">Changed Files</span><p class="one-line" title="' + esc(fileNames(node)) + '">' + esc(files.length ? fileNames(node) : "没有检测到文件差异") + '</p></div><div class="card-metrics"><div class="metric"><strong>' + esc(stats(node)) + '</strong><span>Diff Stats</span></div><div class="metric"><strong>' + files.length + '</strong><span>Changed Files</span></div></div><div class="card-field"><span class="field-label">Warnings</span><p class="one-line ' + (warning === "无" ? "empty-value" : "warning") + '">' + esc(warning) + '</p></div><div class="node-card-actions"><button class="card-action" data-action="details" data-node="' + esc(node.id) + '">查看详情</button><button class="card-action" data-action="compare" data-node="' + esc(node.id) + '">比较当前</button><button class="card-action primary" data-action="resume" data-node="' + esc(node.id) + '" ' + (resumeLoading ? "disabled" : "") + '>' + (resumeLoading ? "正在创建工作区…" : "从这里继续") + '</button></div></article>';
}

function relationButton(id, label) {
  if (!id) return '<span class="none">—</span>';
  const node = baseNode(id);
  return node ? '<button data-select="' + esc(id) + '">' + esc(label || node.title) + '</button>' : '<code title="' + esc(id) + '">' + esc(shortSha(id)) + '</code>';
}

function fileRows(node) {
  const files = changedFiles(node);
  if (files.length === 0) return '<p class="empty-value">此版本没有检测到文件差异。</p>';
  return '<ul class="file-list">' + files.map((file) => '<li class="file-row"><code title="' + esc(file.path) + '">' + esc(file.path) + '</code><span class="file-stats"><span class="add">+' + esc(file.additions) + '</span> <span class="del">-' + esc(file.deletions) + '</span></span></li>').join("") + '</ul>';
}

function derivedNodes(node) {
  const data = graph();
  const ids = new Set();
  for (const [from, to] of [...(data?.gitEdges ?? []), ...(data?.chronologyEdges ?? [])]) {
    if (from === node?.id) ids.add(to);
  }
  return [...ids].map((id) => baseNode(id)).filter(Boolean);
}

function detailBody(node) {
  if (state.detailTab === "diff") {
    const comparison = state.comparison?.nodeId === node.id ? state.comparison.value : null;
    const summary = comparison
      ? (comparison.summary || ((comparison.filesChanged ?? 0) + " 个文件发生变化，新增 " + (comparison.additions ?? 0) + " 行，删除 " + (comparison.deletions ?? 0) + " 行。"))
      : "当前提交：" + shortSha(node.commit) + " · 父提交：" + shortSha(node.parent) + "。点击“比较当前”加载经过 Git 校验的文件差异。";
    const fileData = comparison?.files ? Object.assign({}, node, { changedFiles: comparison.files }) : node;
    return '<section class="detail-section"><h3>Code Diff</h3><div class="comparison-summary">' + esc(summary) + '</div></section><section class="detail-section"><h3>Changed Files</h3>' + fileRows(fileData) + '</section>';
  }
  if (state.detailTab === "conversation") {
    const available = node.conversationStatus === "available";
    return '<section class="detail-section"><h3>Conversation</h3><p>' + esc(conversationSummary(node)) + '</p></section><section class="detail-section"><h3>状态</h3><p class="' + (available ? "" : "warning") + '">' + (available ? "已关联 Trace Conversation。" : "暂无已关联的 AI 对话总结；这不会阻断 Git Trace。") + '</p></section>';
  }
  if (state.detailTab === "relations") {
    const derived = derivedNodes(node);
    return '<section class="detail-section"><h3>Parent Node / Derived Nodes</h3><div class="relation-list"><div class="relation"><span>Git Parent</span>' + relationButton(node.gitParent || node.parentNodeId, baseNode(node.gitParent || node.parentNodeId)?.title) + '</div><div class="relation"><span>Chronological Parent</span>' + relationButton(node.chronologicalParent, baseNode(node.chronologicalParent)?.title) + '</div><div class="relation"><span>Derived Nodes</span><span>' + (derived.length ? derived.map((child) => '<button data-select="' + esc(child.id) + '">' + esc(child.title) + '</button>').join("、") : '<span class="none">—</span>') + '</span></div></div></section>';
  }
  return '<section class="detail-section"><h3>本次目标</h3><p>' + esc(node.goal || node.changes || "未记录目标") + '</p></section><section class="detail-section"><h3>AI Discussion Summary</h3><p>' + esc(conversationSummary(node)) + '</p></section><section class="detail-section"><h3>Key Decisions</h3><p>' + esc(decisionText(node)) + '</p></section><section class="detail-section"><h3>Warnings</h3><p class="' + (warningText(node) === "无" ? "" : "warning") + '">' + esc(warningText(node)) + '</p></section>';
}

function detailPanel(node) {
  if (!node || !state.detailOpen) return "";
  const derived = derivedNodes(node);
  const resume = state.lastResume?.sourceNode === node.id ? state.lastResume : null;
  const runningResume = state.runningAction === "resume:" + node.id;
  const resumeMarkup = resume
    ? '<section class="resume-result"><strong>新 Trace Session 已启动</strong><p>原工作区保持不变，后续开发位于独立 worktree。</p><div class="resume-grid"><div><span>新分支</span><code>' + esc(resume.newBranch) + '</code></div><div><span>工作区</span><code>' + esc(resume.worktreePath) + '</code></div><div><span>Session</span><code>' + esc(resume.sessionId) + '</code></div></div><button class="card-action primary" data-action="handoff" style="width:100%;margin-top:9px">打开新对话并设置工作区</button></section>'
    : "";
  const relationMarkup = '<section class="detail-section"><h3>当前项目关系</h3><div class="relation-list"><div class="relation"><span>Git Parent</span>' + relationButton(node.gitParent || node.parentNodeId, baseNode(node.gitParent || node.parentNodeId)?.title) + '</div><div class="relation"><span>Derived Nodes</span><span>' + (derived.length ? derived.length + " 个后续节点" : "—") + '</span></div></div></section>';
  return '<aside class="detail-panel" aria-label="Trace Card 详情"><header class="detail-header"><div class="node-icon">◆</div><div class="detail-heading"><div class="eyebrow">Selected Trace Card</div><h2>' + esc(node.title) + '</h2><p>' + esc(formatDate(node.createdAt)) + ' · ' + esc(node.commit) + '</p></div><button class="close-detail" data-action="close-detail" aria-label="关闭详情">×</button></header><nav class="detail-tabs" aria-label="版本详情"><button class="detail-tab ' + (state.detailTab === "overview" ? "active" : "") + '" data-tab="overview">概览</button><button class="detail-tab ' + (state.detailTab === "diff" ? "active" : "") + '" data-tab="diff">Code Diff</button><button class="detail-tab ' + (state.detailTab === "conversation" ? "active" : "") + '" data-tab="conversation">Conversation</button><button class="detail-tab ' + (state.detailTab === "relations" ? "active" : "") + '" data-tab="relations">关系</button></nav><div class="detail-scroll"><div class="detail-commit-pair"><div><span class="field-label">当前提交</span><code title="' + esc(node.commit) + '">' + esc(node.commit) + '</code></div><span>vs.</span><div><span class="field-label">上一历史版本</span><code title="' + esc(node.parent) + '">' + esc(node.parent) + '</code></div></div>' + detailBody(node) + resumeMarkup + relationMarkup + '</div><div class="detail-actions"><button data-action="details" data-node="' + esc(node.id) + '">同步完整详情</button><button data-action="compare" data-node="' + esc(node.id) + '">比较当前</button><button class="primary" data-action="resume" data-node="' + esc(node.id) + '" ' + (runningResume ? "disabled" : "") + '>' + (runningResume ? "正在创建安全工作区…" : "从此版本继续") + '</button></div></aside>';
}

function render() {
  const root = document.getElementById("app");
  const data = graph();
  if (!data) {
    root.innerHTML = "<main class=\"empty\"><div class=\"eyebrow\">TraceAndBack MCP App</div><h1>" + (state.connected ? "正在读取当前项目的 Git 历史…" : "请通过 TraceAndBack 打开此组件") + "</h1><p>" + (state.connected ? "工具结果到达后会自动渲染项目 Trace Card。" : "独立打开不会显示任何演示或伪造数据。") + "</p></main>";
    return;
  }
  const nodes = graphNodes();
  const current = selected();
  const repoStatus = state.payload?.status ?? {};
  const dirty = data.status === "working tree dirty";
  const worldStyle = "width:" + state.bounds.width + "px;height:" + state.bounds.height + "px;transform:scale(" + state.zoom + ");transform-origin:top left";
  const emptyOrGraph = nodes.length === 0
    ? "<main class=\"empty\"><div class=\"eyebrow\">Repository connected</div><h1>当前项目还没有 Trace Card</h1><p>创建第一个 Git 提交后点击刷新，版本卡会出现在项目图中。</p></main>"
    : "<main class=\"workspace\"><section class=\"graph-panel\"><div class=\"graph-toolbar\"><div class=\"graph-toolbar-copy\"><h1>项目版本画布</h1><p>每张卡片代表一个可恢复 Git 版本 · 点击卡片查看完整介绍</p></div><div class=\"graph-tools\"><button class=\"graph-tool\" data-action=\"zoom-out\" aria-label=\"缩小\">−</button><span class=\"zoom-label\">" + Math.round(state.zoom * 100) + "%</span><button class=\"graph-tool\" data-action=\"zoom-in\" aria-label=\"放大\">＋</button><button class=\"graph-tool\" data-action=\"zoom-reset\" aria-label=\"重置缩放\">⌂</button></div><div class=\"legend\"><span><i></i>Git ancestry</span><span><i class=\"chronology\"></i>Chronology</span></div></div><div class=\"canvas-viewport\"><div class=\"canvas-world\" style=\"" + worldStyle + "\">" + graphEdges(data) + nodes.map(card).join("") + "</div></div></section>" + detailPanel(current) + "</main>";
  root.innerHTML = "<div class=\"shell\"><header class=\"topbar\"><div class=\"brand-mark\">↗</div><div class=\"heading\"><strong>" + esc(data.name) + " · Project Trace Graph</strong><span>" + esc(data.branch) + " · " + esc(data.status) + "</span></div><div class=\"topbar-spacer\"></div><div class=\"connection\">" + (state.connected ? "MCP 实时数据" : "等待宿主") + "</div><button class=\"toolbar-button\" data-action=\"refresh\">刷新</button></header><section class=\"summary-strip\"><div class=\"stat\"><strong>" + nodes.length + "</strong><span>Trace Cards · 当前项目版本</span></div><div class=\"stat\"><strong title=\"" + esc(data.branch) + "\">" + esc(data.branch) + "</strong><span>当前分支</span></div><div class=\"stat " + (dirty ? "dirty" : "") + "\"><strong>" + esc(data.status) + "</strong><span>工作区状态" + (dirty && repoStatus.untrackedCount ? " · 未跟踪 " + esc(repoStatus.untrackedCount) : "") + "</span></div><div class=\"stat\"><strong>" + esc(data.name) + "</strong><span>项目作用域 · 不混入其他仓库</span></div></section>" + emptyOrGraph + "</div>";
}

async function act(action, nodeId) {
  const node = nodeId ? baseNode(nodeId) : selected();
  try {
    if (action === "refresh") {
      const repository = state.payload?.repository?.path;
      const args = repository ? { repository, limit: 50, cursor: null } : { repositoryId: state.payload?.repository?.id, limit: 50, cursor: null };
      const result = await callTool("trace.render_graph", args);
      const error = errorFromResult(result);
      if (error) throw error;
      if (!applyHostGraph(result)) throw new Error("Trace Graph 返回了无效数据。");
      notify("项目 Trace Graph 已刷新。");
      return;
    }
    if (action === "close-detail") {
      state.detailOpen = false;
      render();
      return;
    }
    if (action === "zoom-in") {
      state.zoom = Math.min(1.8, state.zoom + .1);
      render();
      return;
    }
    if (action === "zoom-out") {
      state.zoom = Math.max(.65, state.zoom - .1);
      render();
      return;
    }
    if (action === "zoom-reset") {
      state.zoom = 1;
      render();
      return;
    }
    if (action === "handoff") {
      await handoffResume();
      return;
    }
    if (!node) return;
    state.selectedId = node.id;
    state.detailOpen = true;
    if (action === "details") {
      state.runningAction = "details:" + node.id;
      render();
      const result = await callTool("trace.get_node", { nodeId: node.id });
      const error = errorFromResult(result);
      if (error) throw error;
      const value = bridgeValue(result);
      if (value && value.id) state.details.set(node.id, value);
      state.runningAction = null;
      state.detailTab = "overview";
      render();
      notify("版本详情已同步。");
      return;
    }
    if (action === "compare") {
      const fromNode = node.parentNodeId || node.gitParent;
      if (!fromNode) {
        notify("初始版本没有可比较的父版本。");
        render();
        return;
      }
      state.runningAction = "compare:" + node.id;
      state.detailTab = "diff";
      render();
      const result = await callTool("trace.compare", { fromNode, toNode: node.id });
      const error = errorFromResult(result);
      if (error) throw error;
      state.comparison = { nodeId: node.id, value: bridgeValue(result) };
      state.runningAction = null;
      render();
      notify("Code Diff 已加载。");
      return;
    }
    if (action === "resume") {
      state.runningAction = "resume:" + node.id;
      render();
      const result = await callTool("trace.resume_from", { nodeId: node.id, strategy: "worktree", checkpointCurrent: true });
      const error = errorFromResult(result);
      if (error) throw error;
      const value = bridgeValue(result);
      if (!value?.newBranch || !value?.worktreePath) throw new Error("恢复操作没有返回可验证的工作区。");
      state.lastResume = value;
      state.runningAction = null;
      state.detailTab = "overview";
      render();
      notify("已从 " + shortSha(node.commit) + " 创建安全工作区：" + value.newBranch);
      try {
        await sendHostMessage(continuationPrompt(node, value));
        notify("已自动通知宿主打开新开发对话并设置工作区。");
      } catch {
        notify("安全工作区已创建；可点击“打开新对话并设置工作区”完成宿主切换。");
      }
    }
  } catch (error) {
    state.runningAction = null;
    render();
    notify("操作失败：" + (error?.message ?? "未知错误"));
  }
}

function bindApp() {
  const root = document.getElementById("app");
  root.addEventListener("click", (event) => {
    const source = event.target;
    const actionButton = source?.closest?.("[data-action]");
    if (actionButton) {
      event.preventDefault();
      event.stopPropagation();
      void act(actionButton.dataset.action, actionButton.dataset.node);
      return;
    }
    const tab = source?.closest?.("[data-tab]");
    if (tab) {
      state.detailTab = tab.dataset.tab;
      render();
      return;
    }
    const related = source?.closest?.("[data-select]");
    if (related) {
      state.selectedId = related.dataset.select;
      state.detailOpen = true;
      state.detailTab = "overview";
      state.comparison = null;
      render();
      return;
    }
    const nodeCard = source?.closest?.(".node-card");
    if (nodeCard) {
      state.selectedId = nodeCard.dataset.node;
      state.detailOpen = true;
      state.detailTab = "overview";
      state.comparison = null;
      render();
    }
  });
}

function installBridge() {
  const api = window.openai;
  if (api?.toolOutput) applyHostGraph(api.toolOutput);
  if (window.parent !== window || api) state.connected = true;
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && state.pending.has(message.id)) {
      const pending = state.pending.get(message.id);
      state.pending.delete(message.id);
      message.error ? pending.reject(new Error(message.error.message || "宿主请求失败")) : pending.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result") {
      applyHostGraph(message.params?.structuredContent ?? message.params);
    }
  }, { passive: true });
}

bindApp();
installBridge();
render();
</script>
</body>
</html>
