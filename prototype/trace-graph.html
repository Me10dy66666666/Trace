function syncUrl(){const u=new URL(location.href);u.searchParams.set("variant",state.variant);u.searchParams.set("project",state.project);history.replaceState({},"",u)}function notify(s){const el=document.getElementById("toast");el.textContent=s;el.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove("show"),1800)}
function inspect(compact=false){const n=node();return `<aside class="inspector"><div class="inspect-top"><div class="inspect-icon">${icon(n.type)}</div><div><b>${esc(n.title)}</b><small>${esc(n.meta)}</small></div></div><div class="commit-pair"><div><small>当前提交</small><code>${esc(n.commit)}</code></div><span>vs.</span><div><small>上一历史版本</small><code>${esc(n.parent)}</code></div></div><div class="card-section"><small>本次目标</small><p>${esc(n.goal||n.changes)}</p></div><div class="card-section"><small>本次提交关键改动</small><p>${esc(n.changes)}</p></div><div class="card-section"><small>AI 对话总结（与上个历史版本之间）</small><p>${esc(n.conversationSummary||n.summary)}</p></div><dl><dt>关键决策</dt><dd>${esc(n.decisions||"保留 Git lineage 与 chronology 两种关系，恢复动作创建本地分支。")}</dd><dt>Changed Files</dt><dd>${esc(n.changedFiles||n.files)}</dd><dt>Diff Stats</dt><dd>${esc(n.diffStats||n.files)}</dd><dt>Warnings</dt><dd>${esc(n.warnings||"无")}</dd></dl><div class="card-actions"><button class="secondary-button" data-action="details">查看详情</button><button class="secondary-button" data-action="compare">比较当前</button></div><button class="pull-button" data-action="pull" onclick="event.stopPropagation()">↓ 从这里继续 · 拉取到本地分支</button></aside>`} function graph(){const data=p(),by=Object.fromEntries(data.nodes.map(n=>[n.id,n]));const curve=(pairs,kind)=>pairs.map(([f,t])=>{const a=by[f],b=by[t];return `<path class="edge ${kind}" d="M${a.x} ${a.y} C${a.x+70} ${a.y},${b.x-70} ${b.y},${b.x} ${b.y}"/>`}).join("");const edges=curve(data.gitEdges,"git")+curve(data.chronologyEdges,"chrono");const nodes=data.nodes.map(n=>`<g class="node version ${n.id===state.selected?"selected":""}" data-node="${n.id}" transform="translate(${n.x-70} ${n.y-29})"><rect width="140" height="58" rx="12"/><text class="icon" x="13" y="22">${icon(n.type)}</text><text class="title" x="33" y="22">${esc(n.title)}</text><text class="meta" x="13" y="42">${esc(n.commit)}</text></g>`).join("");return `<svg class="svg" viewBox="0 0 900 520" aria-label="${esc(data.name)} Trace Graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4c5c70"/></marker></defs><g id="graph-layer" transform="translate(${state.panX} ${state.panY}) scale(${state.zoom})">${edges}${nodes}</g></svg>`} function tools(){return `<div class="tools"><div class="toolbox"><button class="tool" data-action="out">−</button><span class="zoom">${Math.round(state.zoom*100)}%</span><button class="tool" data-action="in">＋</button><button class="tool" data-action="reset">⌂</button></div><div class="legend"><span><i></i>Git lineage</span><span><i class="v"></i>Chronology</span></div></div>`} function variantA(){const data=p();return `<section class="content"><div class="intro"><div><div class="label" style="color:var(--cyan)">Project-scoped trace</div><h1>${esc(data.name)} · Trace Graph</h1><p>卡片表示可恢复的项目版本：当前提交、上一历史版本、关键改动和 AI 对话总结。</p></div><div class="scope"><i></i>仅当前项目 · ${data.nodes.length} versions</div></div><div class="card"><div class="grid"></div>${tools()}${graph()}${inspect()}</div></section>`} function variantB(){const data=p(),events=data.nodes.map(n=>`<article class="event version ${n.id===state.selected?"selected":""}" data-node="${n.id}"><div class="event-dot"></div><div class="event-body"><div class="event-head"><b>${esc(n.title)}</b><time>${esc(n.meta)}</time></div><div class="version-pair"><span>当前 <code>${esc(n.commit)}</code></span><span>上个历史版本 <code>${esc(n.parent)}</code></span></div><div class="card-section"><small>本次目标</small><p>${esc(n.goal||n.changes)}</p></div><div class="card-section"><small>本次提交关键改动</small><p>${esc(n.changes)}</p></div><div class="card-section"><small>AI 对话总结（与上个历史版本之间）</small><p>${esc(n.conversationSummary||n.summary)}</p></div><div class="event-foot"><span>${esc(n.round)} · Changed Files: ${esc(n.changedFiles||n.files)} · Diff: ${esc(n.diffStats||n.files)} · Warnings: ${esc(n.warnings||"无")}</span><button class="pull-button small" data-action="pull" data-pull="${n.id}" onclick="event.stopPropagation()">↓ 从这里继续</button></div></div></article>`).join("");return `<section class="content variant-b"><div class="intro"><div><div class="label" style="color:var(--cyan)">Version continuity</div><h1>${esc(data.name)} · Version Timeline</h1><p>每张卡片是一个项目版本：当前提交对比上一历史版本，记录改动与 AI 对话总结。</p></div><div class="scope"><i></i>独立项目版本链</div></div><div class="stream-layout"><aside class="lanes"><div class="micro">Project versions</div><div class="lane on"><i class="dot"></i><div><b>All versions</b><span>${data.nodes.length} cards · ${data.branch}</span></div></div><div class="lane"><i class="dot" style="background:var(--cyan)"></i><div><b>Git lineage</b><span>实际代码继承关系</span></div></div><div class="lane"><i class="dot" style="background:var(--violet)"></i><div><b>Chronology</b><span>真实开发顺序</span></div></div><div class="note"><b>从这里继续</b>拉取版本会创建本地分支，保留当前工作树，不覆盖当前分支。</div></aside><main class="timeline">${events}</main><aside class="detail"><div class="micro">Selected Trace Card</div><h2>${esc(node().title)}</h2><p>${esc(node().changes)}</p><div class="detail-row"><span>当前提交</span><b>${esc(node().commit)}</b></div><div class="detail-row"><span>上一历史版本</span><b>${esc(node().parent)}</b></div><div class="detail-row"><span>项目分支</span><b>${esc(data.branch)}</b></div><button class="pull-button" data-action="pull">↓ 从这里继续 · 拉取到本地分支</button></aside></div></section>`} function variantC(){const data=p();return `<section class="content variant-c"><div class="map-head"><div><div class="label" style="color:var(--cyan)">Repository constellation</div><h1>${esc(data.name)} · Project Map</h1></div><div class="scope"><i></i>Trace scope locked to ${esc(data.name)}</div></div><div class="map-layout"><aside class="map-nav"><div class="micro">Graph summary</div><div class="stat"><strong>${data.nodes.length}</strong><span>Trace Cards</span></div><div class="stat"><strong>${data.branch}</strong><span>Current local branch</span></div><hr class="rule"><div class="micro">Relationships</div><div class="filter"><i></i>Git lineage</div><div class="filter"><i class="v"></i>Chronology</div><div class="note">项目是图的根作用域。卡片记录版本对比、AI 总结和安全拉取动作。</div></aside><main class="map-canvas"><div class="grid"></div>${tools()}${graph()}${inspect(true)}<div class="hint">滚轮缩放 · 拖拽平移 · 点击卡片查看版本详情</div></main></div></section>`} function render(){syncUrl();const data=p(),v=variants.find(x=>x.key===state.variant);document.getElementById("app").innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="mark">↗</div><b>TraceAndBack</b></div><div class="crumb">Workbuddy / <b>${esc(data.name)}</b> / Trace Graph</div><div class="grow"></div><div class="live"><i></i>${hostMode?"MCP App":"Standalone preview"}</div><button class="trace ${state.open?"active":""}" data-action="toggle">⌘ Trace</button><button class="ghost" data-action="share">↗ Share</button></header><div class="layout"><aside class="rail"><div class="label">Projects</div>${Object.entries(projects).map(([key,x])=>`<button class="project ${key===state.project?"on":""}" data-project="${key}"><span class="glyph">${x.glyph}</span><span class="project-copy"><b>${esc(x.name)}</b><span>${x.nodes.length} versions</span></span></button>`).join("")}<div class="note"><b>项目隔离</b>每个项目拥有自己的 Trace 图；切换项目不会混入其他项目的版本卡片。</div></aside><main class="main"><div class="conversation"><div class="avatar">AI</div><div><b>Project version timeline</b><span>${esc(data.branch)} · ${esc(data.status)}</span></div><div class="head-right"><div class="scope"><i></i>${esc(data.name)}</div></div></div>${state.open?(state.variant==="A"?variantA():state.variant==="B"?variantB():variantC()):`<section class="content"><div class="card" style="display:grid;place-items:center;min-height:360px"><div style="text-align:center"><div class="label" style="color:var(--cyan)">Trace is ready</div><h1>点击右上角 Trace 打开项目图</h1><p style="margin-top:7px;color:var(--muted)">当前项目：${esc(data.name)}</p></div></div></section>`}</main></div></div><nav class="switcher"><button data-variant="prev">←</button><div class="switch-label">${state.variant} · ${v.name} <span>/ prototype</span></div><button data-variant="next">→</button></nav>`;bind()} function bind(){document.querySelectorAll("[data-project]").forEach(b=>b.addEventListener("click",()=>{state.project=b.dataset.project;state.selected=p().nodes[2]?.id||p().nodes[0].id;state.zoom=1;state.panX=0;state.panY=0;render();notify(`已切换到 ${p().name}，Trace 图已隔离`)}));document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.action;const target=b.dataset.pull?p().nodes.find(n=>n.id===b.dataset.pull):node();if(a==="in")state.zoom=Math.min(2.4,state.zoom+.1);if(a==="out")state.zoom=Math.max(.55,state.zoom-.1);if(a==="reset"){state.zoom=1;state.panX=0;state.panY=0}if(a==="toggle")state.open=!state.open;if(a==="pull"){notify(`已准备从 ${target.commit} 创建本地分支（原型）`);return}if(a==="details"){notify(`已打开 ${target.title} 的完整版本详情（原型）`);return}if(a==="compare"){notify(`已准备比较 ${target.commit} 与 ${target.parent}（原型）`);return}if(a==="share"){navigator.clipboard?.writeText(location.href);notify("Trace 图链接已复制（原型）");return}render()}));document.querySelectorAll("[data-variant]").forEach(b=>b.addEventListener("click",()=>{const i=variants.findIndex(x=>x.key===state.variant);state.variant=variants[(i+(b.dataset.variant==="next"?1:-1)+3)%3].key;state.zoom=1;state.panX=0;state.panY=0;render()}));document.querySelectorAll("[data-node]").forEach(n=>n.addEventListener("click",e=>{e.stopPropagation();state.selected=n.dataset.node;render()}));gestures()} function gestures(){document.querySelectorAll(".svg").forEach(svg=>{let drag=null;svg.addEventListener("wheel",e=>{e.preventDefault();state.zoom=Math.min(2.4,Math.max(.55,state.zoom+(e.deltaY<0?.08:-.08)));render()},{passive:false});svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,panX:state.panX,panY:state.panY};svg.setPointerCapture(e.pointerId)});svg.addEventListener("pointermove",e=>{if(!drag)return;state.panX=drag.panX+(e.clientX-drag.x)/1.2;state.panY=drag.panY+(e.clientY-drag.y)/1.2;const layer=svg.querySelector("#graph-layer");if(layer)layer.setAttribute("transform",`translate(${state.panX} ${state.panY}) scale(${state.zoom})`)});svg.addEventListener("pointerup",()=>drag=null)})}addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(!["ArrowLeft","ArrowRight"].includes(e.key))return;e.preventDefault();const i=variants.findIndex(x=>x.key===state.variant);state.variant=variants[(i+(e.key==="ArrowRight"?1:-1)+3)%3].key;render()});const bridgeState={connected:false,pending:new Map(),nextId:1};
function bridgeValue(result){return result?.structuredContent??result?.result?.structuredContent??result}
function positionCards(cards){const columns=Math.max(1,Math.min(4,Math.ceil(Math.sqrt(Math.max(1,cards.length)))));return cards.map((card,index)=>Object.assign({},card,{x:135+(index%columns)*190,y:165+Math.floor(index/columns)*125}))}
function applyHostGraph(result){const value=bridgeValue(result),graph=value?.graph;if(!graph||!Array.isArray(graph.nodes))return false;const cards=positionCards(graph.nodes);projects={host:{name:String(graph.name||"Current repository"),glyph:"T",branch:String(graph.branch||"detached HEAD"),status:String(graph.status||"synced"),nodes:cards,gitEdges:Array.isArray(graph.gitEdges)?graph.gitEdges:[],chronologyEdges:Array.isArray(graph.chronologyEdges)?graph.chronologyEdges:[]}};hostMode=true;state.project="host";state.selected=cards[0]?.id||null;state.zoom=1;state.panX=0;state.panY=0;state.open=true;bridgeState.repositoryId=value?.repository?.id||null;render();return true}
function requestHost(method,params){if(window.parent===window)return Promise.reject(new Error("Trace App host bridge is unavailable."));const id=bridgeState.nextId++;return new Promise((resolve,reject)=>{bridgeState.pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function callHostTool(name,args){const api=typeof window!=="undefined"?window.openai:undefined;if(api&&typeof api.callTool==="function")return api.callTool(name,args);return requestHost("tools/call",{name,arguments:args})}
async function performHostAction(action,target){if(!bridgeState.connected){notify("当前是独立预览；连接 Codex 后可执行 Trace 操作。");return}try{let result;if(action==="pull"){result=await callHostTool("trace.resume_from",{nodeId:target.id,strategy:"worktree",checkpointCurrent:true});const value=bridgeValue(result);notify(value?.newBranch?"已创建本地分支："+value.newBranch:"已完成从该版本继续");return}if(action==="details"){result=await callHostTool("trace.get_node",{nodeId:target.id});notify(bridgeValue(result)?"已获取该版本的完整详情":"版本详情暂不可用");return}if(action==="compare"){const parentNodeId=target.parentNodeId||target.gitParent;if(!parentNodeId){notify("初始版本没有上一历史版本可比较");return}result=await callHostTool("trace.compare",{fromNode:parentNodeId,toNode:target.id});notify(bridgeValue(result)?"已获取当前提交与上一版本的比较结果":"比较结果暂不可用")}}catch(error){notify("Trace 操作失败："+(error?.message||"请查看 MCP 错误"))}}
function installMcpBridge(){const api=typeof window!=="undefined"?window.openai:undefined;if(window.parent===window&&!api)return;bridgeState.connected=true;if(api?.toolOutput)applyHostGraph(api.toolOutput);window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&bridgeState.pending.has(message.id)){const pending=bridgeState.pending.get(message.id);bridgeState.pending.delete(message.id);if(message.error)pending.reject(message.error);else pending.resolve(message.result);return}if(message.method==="ui/notifications/tool-result")applyHostGraph(message.params?.structuredContent??message.params)}, {passive:true});document.addEventListener("click",event=>{const source=event.target;const button=source&&typeof source.closest==="function"?source.closest("[data-action]"):null;if(!button||!bridgeState.connected)return;const action=button.dataset.action;if(!["pull","details","compare"].includes(action))return;event.preventDefault();event.stopImmediatePropagation();const target=button.dataset.pull?p().nodes.find(item=>item.id===button.dataset.pull):node();void performHostAction(action,target||node())},true)}
installMcpBridge();render();
</script></body></html>
